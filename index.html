55, "category": "其他"}, {"id": "ts_1791614734_488", "author": "bosschung", "handle": "bosschung", "date": "2026-10-10", "timestamp": 1791614734, "text": "5天\n有一種初戀情人的感覺💓💓💓💓💓💓", "likes": 142, "replies": 3, "url": "https://www.threads.com/@bosschung/post/DeERG32idrF", "top_comments": [], "engagement": 145, "category": "其他"}, {"id": "ts_1791614719_881", "author": "shoyo_0929", "handle": "shoyo_0929", "date": "2026-10-10", "timestamp": 1791614719, "text": "1小時\n鐵蟲/鐵A蟲O\n-\n東尼被拒絕了。\n不敢相信。\n他跟彼得求婚，彼得拒絕了。\n哇喔，不敢相信。\n「東尼，你不能、不能這樣！我們......我們才交往三個月！」\n「Huh？是誰？之前不論我怎麼拒絕，都繼續纏著我求我跟他交往的人是誰？」\n「求你和我交往和詢問你願意跟我交往嗎應該是兩回事，不一樣。」\n「很好，所以你如願以償，卻在三個月後後悔了？」\n「怎麼可能！只是、我、我追你三年了，這三個月就像夢一樣......」\n「Ok，那你在那張紙上簽名，你就能美夢成真。」\n「交往和結婚應該也是兩回事。」\n「喔，所以，你只是想跟我交往，不想跟我結婚？真是個小渣男。」\n「……東尼，我的意思是，這太快了！我還沒做好心理準備！」", "likes": 129, "replies": 4, "url": "https://www.threads.com/@shoyo_0929/post/DeTT8kWFBmj", "top_comments": [], "engagement": 133, "category": "案例分享"}, {"id": "ts_1791614902_887", "author": "hwennn.02", "handle": "hwennn.02", "date": "2026-10-10", "timestamp": 1791614902, "text": "7小時\n我還是單身 只是懶得紀錄了而已\n累累病很嚴重", "likes": 104, "replies": 3, "url": "https://www.threads.com/@hwennn.02/post/DeSreUqAZVt", "top_comments": [], "engagement": 107, "category": "其他"}, {"id": "ts_1791614755_212", "author": "2026-9-28", "handle": "wrfhug2", "date": "2026-09-28", "timestamp": 1791614755, "text": "2026-9-28\n什麼是交往 要就直接結婚！", "likes": 93, "replies": 6, "url": "https://www.threads.com/@wrfhug2/post/Dd1Qil_j10a", "top_comments": [], "engagement": 99, "category": "其他"}, {"id": "ts_1791614645_473", "author": "amis._.0311", "handle": "amis._.0311", "date": "2026-10-10", "timestamp": 1791614645, "text": "14小時\n剛到新的公司上班\n認識三天的同事 竟然比不過在一起幾年的感情\n💔💔💔💔💔💔💔💔💔💔💔💔💔💔\n⚠️女友出軌 當場抓⛔️\n👨：我其實早已知道答案。但他還是繼續欺騙裝傻 真的以為我不知道🙂\n沒想到幾年的愛情💑 🫀比不上五天的愛情💔\n這位男生 花蓮人⛔️\n⚠️有人認識這位猴子嗎？\n⚠️我拜託你出來道歉😁", "likes": 68, "replies": 8, "url": "https://www.threads.com/@amis._.0311/post/DeR7cSEmbxn", "top_comments": [], "engagement": 76, "category": "案例分享"}, {"id": "ts_1791614719_857", "author": "thai._.awesome", "handle": "thai._.awesome", "date": "2026-10-10", "timestamp": 1791614719, "text": "1小時\n大家都翻了Mami的聲明 那我來翻Papi的（？\n—————————————————————\n在Shelly之前的直播澄清事實之後，仍有一些疑問和誤解。今天，Shelly想做最後的澄清。\n1. 關於Shelly在直播中提到的「兩個世界」：\nShelly想再次強調，她提到的「兩個世界」並非指那個男人(P’Pond)，一個世界是她的母親，另一個世界是P'Pandao。Pond是Shelly的過去；是她為了遵從母親的意願而選擇交往的一段感情。這並非她現在所處的「另一個世界」。 Shelly明白，討論此事可能會讓很多人感到困惑，並引發諸多疑問，所以她想在此澄清。\n2. 關於這次分享個人資訊：\n直播談論自己的生活，包括與母親的相處，對Shelly來說絕非易事，為此已經思考多日，這是她人生中第二次感覺自己做了真正想要的選擇。第一次是在她決定去試鏡「Loft」這個角色的時候，因為那時她想追逐自己的夢想。雪莉知道，在這次的陳述中，她可能表達得不夠清楚，有些話可能被誤解了，或者讓一些人感到難過，真的很抱歉。但我說的每一個字都是發自內心的。這是我第一次嘗試表達自己的真實感受，而不是迎合別人的想法。", "likes": 73, "replies": 3, "url": "https://www.threads.com/@thai._.awesome/post/DeTSaRjCd8Q", "top_comments": [], "engagement": 76, "category": "案例分享"}, {"id": "ts_1791614588_460", "author": "zhouzhiling92", "handle": "zhouzhiling92", "date": "2026-10-10", "timestamp": 1791614588, "text": "6天\n有人缺女朋友嗎\n我缺男朋友", "likes": 45, "replies": 29, "url": "https://www.threads.com/@zhouzhiling92/post/DeDUzM5E7am", "top_comments": [], "engagement": 74, "category": "其他"}, {"id": "ts_1791614873_911", "author": "南優賢", "handle": "starlight_ifnt", "date": "2026-09-26", "timestamp": 1791614873, "text": "南優賢\n2026-9-26\n已讀不回的壞蛋", "likes": 63, "replies": 6, "url": "https://www.threads.com/@starlight_ifnt/post/DdwYYqrAY72", "top_comments": [], "engagement": 69, "category": "其他"}, {"id": "ts_1791614645_619", "author": "youzizi15", "handle": "youzizi15", "date": "2026-10-10", "timestamp": 1791614645, "text": "9小時\n離婚3年了\n前夫不行還出軌，現在讓我想想都生氣\n3年裡一直沒有走出來，現在我想有人能夠真心陪陪我\n我很需要愛❤️。也可以早跑\n我不挑的~只要你不嫌棄我醜", "likes": 36, "replies": 18, "url": "https://www.threads.com/@youzizi15/post/DeSdjg3ArT2", "top_comments": [], "engagement": 54, "category": "案例分享"}, {"id": "ts_1791614932_105", "author": "hushlittlebaby_q", "handle": "hushlittlebaby_q", "date": "2026-10-10", "timestamp": 1791614932, "text": "1天\n顺直味最轻的直男", "likes": 48, "replies": 2, "url": "https://www.threads.com/@hush ，針對自身感情狀況、對象想法與未來發展深入解析。", "likes": 34, "replies": 9, "url": "https://www.threads.com/@tarot_vk/post/DeLlWhClMUW", "top_comments": [], "engagement": 43, "category": "觀點爭論"}, {"id": "ts_1791614734_367", "author": "yijun971016", "handle": "yijun971016", "date": "2026-10-10", "timestamp": 1791614734, "text": "2天\n間歇性渴望戀愛 持續性喜愛單身❤️", "likes": 31, "replies": 6, "url": "https://www.threads.com/@yijun971016/post/DeN0yzmE0oQ", "top_comments": [], "engagement": 37, "category": "其他"}, {"id": "ts_1791614801_806", "author": "2026-10-2", "handle": "lhleo520", "date": "2026-10-02", "timestamp": 1791614801, "text": "2026-10-2\n他是个满分男，但pc喜欢冷暴力", "likes": 17, "replies": 9, "url": "https://www.threads.com/@lhleo520/post/Dd_tsFemzB7", "top_comments": [], "engagement": 26, "category": "其他"}, {"id": "ts_1791614991_615", "author": "龍貓日記📓", "handle": "a_do_yang", "date": "2026-09-28", "timestamp": 1791614991, "text": "龍貓日記📓\n2026-9-28\n🐭：人，你的邊界感呢", "likes": 25, "replies": 0, "url": "https://www.threads.com/@a_do_yang/post/Dd1E5_FiWzO", "top_comments": [], "engagement": 25, "category": "其他"}, {"id": "ts_1791614755_866", "author": "2026-9-21", "handle": "dtmaqj54", "date": "2026-09-21", "timestamp": 1791614755, "text": "2026-9-21\n什麼是交往 要就直接結婚！", "likes": 24, "replies": 0, "url": "https://www.threads.com/@dtmaqj54/post/DdjKNq_jyE-", "top_comments": [], "engagement": 24, "category": "其他"}, {"id": "ts_1791614755_923", "author": "2026-9-30", "handle": "wrfhug2", "date": "2026-09-30", "timestamp": 1791614755, "text": "2026-9-30\n什麼是交往 要就直接結婚！", "likes": 21, "replies": 3, "url": "https://www.threads.com/@wrfhug2/post/Dd6i1HNj4pH", "top_comments": [], "engagement": 24, "category": "其他"}, {"id": "ts_1791614755_475", "author": "2026-10-2", "handle": "wrfhug2", "date": "2026-10-02", "timestamp": 1791614755, "text": "2026-10-2\n什麼是交往 要就直接結婚！", "likes": 22, "replies": 1, "url": "https://www.threads.com/@wrfhug2/post/Dd_vqtmD236", "top_comments": [], "engagement": 23, "category": "其他"}, {"id": "ts_1791 const CHART_COLORS = ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});

// Punchlines
const punchlineContainer = document.getElementById('punchlineContainer');
DATA.punchlines.forEach(pl => {
  const div = document.createElement('div');
  div.className = 'punchline-card';
  div.innerHTML = `<div class="punchline-text">\u201c${pl.text}\u201d</div><div class="punchline-source">\u2014 ${pl.source} &middot; &#10084; ${pl.likes?.toLocaleString()}</div>`;
  punchlineContainer.appendChild(div);
});

// Topic horizontal bar chart
const dist = DATA.topicDistribution;
const sortedDist = Object.entries(dist).sort((a,b) => b[1] - a[1]);
new Chart(document.getElementById('topicBarChart'), {
  type: 'bar',
  data: {
    labels: sortedDist.map(([k]) => k),
    datasets: [{
      data: sortedDist.map(([,v]) => v),
      backgroundColor: ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'],
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ display:false }, title:{ display:false } },
      y:{ grid:{ display:false }, title:{ display:false } }
    }
  }
});

// Likes bar chart
const sorted = [...DATA.posts].sort((a,b) => b.likes - a.likes).slice(0,10);
const labels = sorted.map(p => (p.author || '\u533f\u540d') + ' ' + (p.text||'').slice(0,15).replace(/\n/g,' ') + '\u22ef');
new Chart(document.getElementById('likesBarChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '\u8b9a\u6578',
      data: sorted.map(p => p.likes),
      backgroundColor: '#f5a0b5',
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v } },
      y:{ grid:{ display:false }, title:{ display:false } }
    },
    layout:{ padding:{ right:40 } }
  }
});

// Topic summaries
const topicContainer = document.getElementById('topicContainer');
DATA.topicSummaries.forEach(s => {
  const div = document.createElement('div');
  div.className = 'topic-card';
  div.innerHTML = `<div class="topic-title">&#128204; ${s.topic} <span class="topic-meta">（${s.post_count} 則 · &#10084; ${s.total_likes?.toLocaleString()}）</span></div><div class="topic-summary">${s.summary}</div>`;
  topicContainer.appendChild(div);
});

// Filters
const filterContainer = document.getElementById('filterContainer');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '全部';
allBtn.dataset.filter = 'all';
filterContainer.appendChild(allBtn);
const topics = [...new Set(DATA.posts.map(p => p.category || p.category_hint || '其他'))];
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = t;
  btn.dataset.filter = t;
  filterContainer.appendChild(btn);
});

let currentFilter = 'all';
function renderPosts() {
  const filtered = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const container = document.getElementById('postListContainer');
  container.innerHTML = filtered.map((p,i) => `
    <div class="post-card">
      <h4>&#128100; ${p.author || '匿名'} <span class="meta">@${p.handle||''} &middot; ${p.date||''}</span></h4>
      <div class="text" onclick="this.classList.toggle('expanded')">${p.text}</div>
      <div class="stats">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies} &middot; ${p.category || p.category_hint || '未分類'}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往原文</a>' : ''}
    </div>
  `).join('');
  const sel = document.getElementById('postSelect');
  sel.innerHTML = filtered.map((p,i) => `<option value="${i}">&#10084;${p.likes} | ${p.author||'匿名'} | ${(p.text||'').slice(0,30)}...</option>`).join('');
  sel.onchange = () => showDetail(parseInt(sel.value));
}

filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});

function showDetail(idx) {
  const posts = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const p = posts[idx];
  if (!p) return;
  const container = document.getElementById('detailContainer');
  let comments = '';
  (p.top_comments || []).forEach(c => {
    comments += `<div class="comment"><div class="comment-author">${c.author||'匿名'}</div><div>${c.text}</div><div style="font-size:0.75rem;color:#adb5bd;">&#10084; ${c.likes}</div></div>`;
  });
  container.innerHTML = `
    <div class="detail-container">
      <h3>&#128100; ${p.author||'匿名'} <span style="font-weight:400;color:#868e96;">@${p.handle||''}</span></h3>
      <div style="font-size:0.8rem;color:#868e96;">${p.date||''} &middot; ${p.category||p.category_hint||'未分類'}</div>
      <div class="text">${p.text}</div>
      <div style="color:#212529;font-size:0.9rem;">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往 Threads 原文</a>' : ''}
      <div style="margin-top:0.8rem;font-weight:600;color:#212529;">&#128172; 熱門留言（前 ${(p.top_comments||[]).length} 則）</div>
      ${comments || '<div style="color:#adb5bd;">暫無留言資料</div>'}
    </div>
  `;
}

renderPosts();
showDetail(0);
</script>
