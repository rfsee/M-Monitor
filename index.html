/@lhy.04_/post/De118Qhk0cn", "top_comments": [], "engagement": 948, "category": "其他"}, {"id": "ts_1792819822_789", "author": "感情", "handle": "lilli.ankuo", "date": "2026-10-24", "timestamp": 1792819822, "text": "感情\n14小時\n今天剛好有空滑脆 ￼看到不少脆友們為情所擾 ￼我想分享\n我54歲，目前單身。\n經濟獨立、身體健康、情緒穩定，外表也還算對得起自己。😆\n我對生活充滿熱情，\n對愛情依然有憧憬，\n始終覺得，兩個人相愛是一件很美好的事。\n但走到人生這個階段，我越來越清楚自己想要的是什麼。\n我不需要一個人來證明自己的價值，也不需要一段關係來填補生活的空白。\n能讓我心動的男人，\n至少要有與我相當的條件，\n更重要的是，有相近的價值觀、\n相同的人生方向，\n以及一起享受生活的熱情。\n我希望兩個人在一起，\n不是誰依附誰，也不是誰委屈誰，而是彼此欣賞、互相尊重，\n讓原本就很好的生活，變得更加精彩。\n我相信愛情，但不迷信愛情。\n我期待有人同行，但不害怕獨自前行。\n遇見值得的人，我願意真心投入。沒有遇見，我也能把日子過得有聲有色。\n因為我始終相信，真正好的感情，不是讓女人失去自己，\n而是讓兩個完整的人，遇見更好的彼此。\n不遷就，不強求。\n不因寂寞而選擇，\n也不因年齡而降低標準。\n單身不是因為沒有人愛，\n而是我已經有能力，選擇自己想要的愛。 ❤️", "likes": 720, "replies": 150, "url": "https://www.threads.com/@lilli.ankuo/post/De1zjE8mdfG", "top_comments": [], "engagement": 870, "category": "案例分享"}, {"id": "ts_1792819692_481", "author": "syyylvvvia_", "handle": "syyylvvvia_", "date": "2026-10-24", "timestamp": 1792819692, "text": "5天\n他们吵架都在吵什么啊🫪可好奇啊\njounharu_\n5天\n不是好好笑 所以小篤這天真的吵架了嗎哈哈哈哈\n昨天那個花絮裡面 明明兩個人站在一起\n平時可能會貼上去了\n但這天兩個人隔著那個距離\n像隔了一條銀河一樣 沒有任何對視\n連宣傳a nation的影片都感覺氣氛有點微妙\n還有那天的dive into you 他們沒有一起唱\n不知道是不是真的吵架🤣🤣", "likes": 751, "replies": 8, "url": "https://www.threads.com/@syyylvvvia_/post/Deo1PLxCkGA", "top_comments": [], "engagement": 759, "category": "幽默梗"}, {"id": "ts_1792819692_917", "author": "jounharu_", "handle": "jounharu_", "date": "2026-10-24", "timestamp": 1792819692, "text": "5天\n不是好好笑 所以小篤這天真的吵架了嗎哈哈哈哈\n昨天那個花絮裡面 明明兩個人站在一起\n平時可能會貼上去了\n但這天兩個人隔著那個距離\n像隔了一條銀河一樣 沒有任何對視\n連宣傳a nation的影片都感覺氣氛有點微妙\n還有那天的dive into you 他們沒有一起唱\n不知道是不是真的吵架🤣🤣", "likes": 751, "replies": 8, "url": "https://www.threads.com/@jounharu_/post/Deow1Mkkw0T", "top_comments": [], "engagement": 759, "category": "幽默梗"}, {"id": "ts_1792819678_420", "author": "sanny911019", "handle": "sanny911019", "date": "2026-10-24", "timestamp": 1792819678, "text": "6天\n女朋友想要 女朋友得到꒰◍⍢◍꒱۶", "likes": 685, "replies": 14, "url": "https://www.threads.com/@sann , "author": "elenacat1124", "handle": "elenacat1124", "date": "2026-10-24", "timestamp": 1792819649, "text": "4小時\n以前交往十年的男朋友\n他口袋的零錢都是幾千元\n每天背一個黑色背包，裡面都裝約1百萬現金\n買過兩棟6000多萬的房子（一棟在勤美綠園道7-11樓上），3棟3000多萬的\n現在的診所也是自己買下來的（120幾坪）在文心路上\n每兩三年換一台新汽車\n他這樣算有錢人嗎？\n其實我不知道\n我很少花他的錢\n除了吃飯，他很少讓我付錢\n我要付錢他會生氣\n一起出國若他要開會\n會拿1~2萬美金給我或黑卡給我\n叫我去血拼，買東西包包回去送給家人同事朋友\n我通常都原封不動再還給他\n他每次都納悶我怎麼都把錢不多不少又還給他\n其實他不懂\n我不想欠任何人東西\n花他的錢感覺就會覺得欠他許多\n這樣的感情也會不平衡\n我朋友都說我是怪咖\n我從來不覺得自己是怪咖\n只覺得自己過的心安理得\n這是真實的我的經歷，基於無法公開他的姓名跟照片，相信一定又有人說我在編故事\n再說我編故事的我立刻封鎖", "likes": 335, "replies": 146, "url": "https://www.threads.com/@elenacat1124/post/De27-ndo8j8", "top_comments": [], "engagement": 481, "category": "案例分享"}, {"id": "ts_1792819678_225", "author": "bonniebonnyx", "handle": "bonniebonnyx", "date": "2026-10-24", "timestamp": 1792819678, "text": "2天\n同款男友🫪", "likes": 386, "replies": 4, "url": "https://www.threads.com/@bonniebonnyx/post/DevtqpGlAzC", "top_comments": [], "engagement": 390, "category": "其他"}, {"id": "ts_1792819822_137", "author": "norah2.14", "handle": "norah2.14", "date": "2026-10-24", "timestamp": 1792819822, "text": "18小時\n阿珍目前單身中\n今年50歲🤣🤣\n#母女 #生日花束 #生日蛋糕🎂", "likes": 374, "replies": 13, "url": "https://www.threads.com/@norah2.14/post/De1aHtBknNF", "top_comments": [], "engagement": 387, "category": "其他"}, {"id": "ts_1792819563_675", "author": "2026-10-16", "handle": "ineedsomuchlove", "date": "2026-10-16", "timestamp": 1792819563, "text": "2026-10-16\n點解要分手", "likes": 326, "replies": 60, "url": "https://www.threads.com/@ineedsomuchlove/post/DejwrRGkmLX", "top_comments": [], "engagement": 386, "category": "其他"}, {"id": "ts_1792819649_856", "author": "1yan.iix", "handle": "1yan.iix", "date": "2026-10-24", "timestamp": 1792819649, "text": "1天\n有人要交往嗎(ㆀ˘･з･˘)\n需要一個戀愛腦的男友 認真的找我", "likes": 350, "replies": 22, "url": "https://www.threads.com/@1yan.iix/post/DezQrUxkd28", "top_comments": [], "engagement": 372, "category": "其他"}, {"id": "ts_1792819749_357", "author": "2026-10-9", "handle": "zy1o67", "date": const CHART_COLORS = ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});

// Punchlines
const punchlineContainer = document.getElementById('punchlineContainer');
DATA.punchlines.forEach(pl => {
  const div = document.createElement('div');
  div.className = 'punchline-card';
  div.innerHTML = `<div class="punchline-text">\u201c${pl.text}\u201d</div><div class="punchline-source">\u2014 ${pl.source} &middot; &#10084; ${pl.likes?.toLocaleString()}</div>`;
  punchlineContainer.appendChild(div);
});

// Topic horizontal bar chart
const dist = DATA.topicDistribution;
const sortedDist = Object.entries(dist).sort((a,b) => b[1] - a[1]);
new Chart(document.getElementById('topicBarChart'), {
  type: 'bar',
  data: {
    labels: sortedDist.map(([k]) => k),
    datasets: [{
      data: sortedDist.map(([,v]) => v),
      backgroundColor: ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'],
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ display:false }, title:{ display:false } },
      y:{ grid:{ display:false }, title:{ display:false } }
    }
  }
});

// Likes bar chart
const sorted = [...DATA.posts].sort((a,b) => b.likes - a.likes).slice(0,10);
const labels = sorted.map(p => (p.author || '\u533f\u540d') + ' ' + (p.text||'').slice(0,15).replace(/\n/g,' ') + '\u22ef');
new Chart(document.getElementById('likesBarChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '\u8b9a\u6578',
      data: sorted.map(p => p.likes),
      backgroundColor: '#f5a0b5',
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v } },
      y:{ grid:{ display:false }, title:{ display:false } }
    },
    layout:{ padding:{ right:40 } }
  }
});

// Topic summaries
const topicContainer = document.getElementById('topicContainer');
DATA.topicSummaries.forEach(s => {
  const div = document.createElement('div');
  div.className = 'topic-card';
  div.innerHTML = `<div class="topic-title">&#128204; ${s.topic} <span class="topic-meta">（${s.post_count} 則 · &#10084; ${s.total_likes?.toLocaleString()}）</span></div><div class="topic-summary">${s.summary}</div>`;
  topicContainer.appendChild(div);
});

// Filters
const filterContainer = document.getElementById('filterContainer');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '全部';
allBtn.dataset.filter = 'all';
filterContainer.appendChild(allBtn);
const topics = [...new Set(DATA.posts.map(p => p.category || p.category_hint || '其他'))];
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = t;
  btn.dataset.filter = t;
  filterContainer.appendChild(btn);
});

let currentFilter = 'all';
function renderPosts() {
  const filtered = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const container = document.getElementById('postListContainer');
  container.innerHTML = filtered.map((p,i) => `
    <div class="post-card">
      <h4>&#128100; ${p.author || '匿名'} <span class="meta">@${p.handle||''} &middot; ${p.date||''}</span></h4>
      <div class="text" onclick="this.classList.toggle('expanded')">${p.text}</div>
      <div class="stats">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies} &middot; ${p.category || p.category_hint || '未分類'}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往原文</a>' : ''}
    </div>
  `).join('');
  const sel = document.getElementById('postSelect');
  sel.innerHTML = filtered.map((p,i) => `<option value="${i}">&#10084;${p.likes} | ${p.author||'匿名'} | ${(p.text||'').slice(0,30)}...</option>`).join('');
  sel.onchange = () => showDetail(parseInt(sel.value));
}

filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});

function showDetail(idx) {
  const posts = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const p = posts[idx];
  if (!p) return;
  const container = document.getElementById('detailContainer');
  let comments = '';
  (p.top_comments || []).forEach(c => {
    comments += `<div class="comment"><div class="comment-author">${c.author||'匿名'}</div><div>${c.text}</div><div style="font-size:0.75rem;color:#adb5bd;">&#10084; ${c.likes}</div></div>`;
  });
  container.innerHTML = `
    <div class="detail-container">
      <h3>&#128100; ${p.author||'匿名'} <span style="font-weight:400;color:#868e96;">@${p.handle||''}</span></h3>
      <div style="font-size:0.8rem;color:#868e96;">${p.date||''} &middot; ${p.category||p.category_hint||'未分類'}</div>
      <div class="text">${p.text}</div>
      <div style="color:#212529;font-size:0.9rem;">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往 Threads 原文</a>' : ''}
      <div style="margin-top:0.8rem;font-weight:600;color:#212529;">&#128172; 熱門留言（前 ${(p.top_comments||[]).length} 則）</div>
      ${comments || '<div style="color:#adb5bd;">暫無留言資料</div>'}
    </div>
  `;
}

renderPosts();
showDetail(0);
</script>
