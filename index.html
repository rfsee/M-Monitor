timestamp": 1794641025, "text": "14小時\n還是那句話 不是結婚就是分手", "likes": 6772, "replies": 26, "url": "https://www.threads.com/@2014_11_14/post/DfsJdDJH-80", "top_comments": [], "engagement": 6798, "category": "其他"}, {"id": "ts_1794640912_900", "author": "midnightnotes.tw", "handle": "midnightnotes.tw", "date": "2026-11-14", "timestamp": 1794640912, "text": "20小時\n婚禮剩18天，我才知道男友把前女友安排在主桌。\n不是普通賓客，是坐在他爸媽旁邊的位置。\n昨天婚顧傳來最後確認的座位表。\n我看到一個很熟悉的名字。\n林小姐。\n就是那個男友說「早就沒聯絡」的前女友。\n我問他為什麼邀請她。\n他說：「我媽跟她很熟，不邀請很奇怪。」\n我說：「那為什麼坐主桌？」\n他回：「只是吃頓飯，妳不要想太多。」\n我直接打給婚顧確認。\n婚顧猶豫了一下，說：\n「其實這個座位是新郎媽媽特別交代的，她說林小姐以前差點成為他們家媳婦。」\n我整個人愣住。\n更離譜的是，婚顧接著說：\n「阿姨還要求我們準備一束花，讓新郎在敬酒時送給林小姐。」\n我把通話內容告訴男友。\n他竟然說：「我媽只是想彌補以前的遺憾。」\n我問：「那我的婚禮，是要幫你們家完成誰的遺憾？」\n他一句話都答不出來。\n今天我通知婚顧，座位表先不要印。\n因為我突然不確定，這場婚禮到底還要不要辦。", "likes": 5049, "replies": 1206, "url": "https://www.threads.com/@midnightnotes.tw/post/DfrevOrlFP8", "top_comments": [], "engagement": 6255, "category": "案例分享"}, {"id": "ts_1794641310_665", "author": "2026-10-31", "handle": "lulumi518", "date": "2026-10-31", "timestamp": 1794641310, "text": "2026-10-31\n直男思維😡\nt6dml6d\n2026-10-30\n之前一直不太理解\n為什麼有些人會這麼厭惡同性戀\n結果聽到身邊一個恐同男生朋友說\n他覺得兩個男生在一起很噁心\n兩個女生在一起會害他找不到女朋友⋯⋯\n我立刻就想昏倒==\n有沒有可能找不到女朋友是你自身問題😅", "likes": 5959, "replies": 91, "url": "https://www.threads.com/@lulumi518/post/DfJwCkdFCLB", "top_comments": [], "engagement": 6050, "category": "觀點爭論"}, {"id": "ts_1794641310_291", "author": "2026-10-30", "handle": "t6dml6d", "date": "2026-10-30", "timestamp": 1794641310, "text": "2026-10-30\n之前一直不太理解\n為什麼有些人會這麼厭惡同性戀\n結果聽到身邊一個恐同男生朋友說\n他覺得兩個男生在一起很噁心\n兩個女生在一起會害他找不到女朋友⋯⋯\n我立刻就想昏倒==\n有沒有可能找不到女朋友是你自身問題😅", "likes": 5959, "replies": 91, "url": "https://www.threads.com/@t6dml6d/post/DfHNpS1k5dN", "top_comments": [], "engagement": 6050, "category": "觀點爭論"}, {"id": "ts_1794641210_632", "author": "2026-11-2", "handle": "169ugjuh", "date": "2026-11-02", "timestamp": 1794641210, "text": "2026-11-2\n完了。\n我偷偷寫青梅竹馬這麼久，\n她終於發現這個帳號了。\n而且她把我叫出去吃飯，我還以為是要約會。\n結果一坐下，她就把手機放到我面前。\n「這是你寫的吧？」\n我低頭一看。\n是我之前寫她特地繞路幫我買麵的那篇。\n我整個人僵住。\n「妳怎麼看到的？」\n她看著我。\n「你先回答我。」\n我只好點頭。\n「對啦，是我。」\n她拿回手機，繼續往下滑。\n「所以這個告白失敗四年的，就是你？」\n我說：\n「不然還有誰。」\n她直接笑出來。\n「你到底要講幾次啦！」\n我說：\n「怕新來的人看不懂啊。」\n她又滑了幾篇。\n突然停下來。\n「等一下，這篇是我去你家吃火鍋那次欸！」\n我說：\n「對啊。」\n她抬頭看我。\n「你連我不敢去吃飯都寫？」\n我開始心虛。\n「妳會生氣喔？」\n她沒回答。\n繼續滑。\n滑到我寫她第一次為了跟我吃飯挑衣服那篇。\n她突然把手機反過來蓋在桌上。\n我問：\n「怎樣？」", "likes": 5519, "replies": 487, "url": "https://www.threads.com/@169ugjuh/post/DfPANink3KH", "top_comments": [], "engagement": 6006, "category": "抱怨"}, {"id": "ts_1794641296_854", "author": "2026-10-26", "handle": "t2282249", "date": "2026-10-26", "timestamp": 1794641296, "text": "2026-10-26\n到底誰可以接受遠距離戀愛\n不講電話\n也不視訊\n幾乎不見面\n每天只靠文字訊息來往還不分享生活和不給情緒價值\n這樣的感情要怎麼談的下去", "likes": 5542, "replies": 450, "url": "https://www.threads.com/@t2282249/post/De8OzeQEtuJ", "top_comments": [], "engagement": 5992, "category": "案例分享"}, {"id": "ts_1794641125_867", "author": "kiriyama.neko", "handle": "kiriyama.neko", "date": "2026-11-14", "timestamp": 1794641125, "text": "8小時\n據我多年的觀察，\n89妹有分兩種：\n1.\n瘦不拉幾，顏值頂天，超會搭，名牌包，通常都很I，不喜歡講話很高冷。\n護花使者一狗票。刺青都很兇（但不好看\n2.\n胖地要死，莫名自信，邋遢跟暴露之間反覆橫跳，講話超大聲，喜歡亂買便宜貨。\n超黏男友，因為放生之後就會沒人要。\n（但又對男友很不好，莫名其妙", "likes": 4895, "replies": 192, "url": "https://www.threads.com/@kiriyama.neko/post/DfsxhcUGKU-", "top_comments": [], "engagement": 5087, "category": "其他"}, {"id": "ts_1794640912_451", "author": "hikr724", "handle": "hikr724", "date": "2026-11-14", "timestamp": 1794640912, "text": "21小時\n一鍵召回機率高達百分之99", "likes": 4992, "replies": 69, "url": "https://www.threads.com/@hikr724/post/DfrTZaiDxF6", "top_comments": [], "engagement": 5061, "category": "其他"}, {"id": "ts_1794641040_383", "author": "黃仁勳", "handle": "wujansin", "date": "2026-11-14", "timestamp": 1794641040, "text": "黃仁勳\n1天\n我看張忠謀傳記的下半冊，老張當年有考慮找黃仁勳來接班，當台積電CEO。但老黃有自己公司，不想當打工仔就拒絕。\n現在老黃失業了，或許台積電可以考慮一下。", "likes": 4488, "replies": 294, "url": "https://www.threads.com/@wujansin/post/Dfq5IPDIDXK", "top_comments": [], "engagement": 4782, "category": "抱怨"}, {"id": "ts_1794641153_838", "author": "2026-10-27", "handle": "ggggggggreen", "date": "2026-10-27", "timestamp": 1794641153, "text": "2026-10-27\n兩個在吵架 被我罵", "likes": 4730, "replies": 42, "url": "https://www.threads.com/@ggggggggreen/post/DfANAihAWp4", "top_comments": [], "engagement": 4772, "category": "抱怨"}, {"id": "ts_1794641325_814", "author": "2026-11-4", "handle": "louis0429", "date": "2026-11-04", "timestamp": 1794641325, "text": "2026-11-4\n我是個佔有慾很強但控制欲幾乎為0的人\n什麼意思，大概就是常常吃醋，吃醋的時候會在你耳邊酸言酸語，但還是會叫你快點出門吧\n我當然想把你鎖在我的地下室，但我會等你自己走進來", "likes": 4235, "replies": 61, "url": "https://www.threads.com/@louis0429/post/DfVEyRRktnX", "top_comments": [], "engagement": 4296, "category": "其他"}, {"id": "ts_1794641196_289", "author": "生育率", "handle": "zack.lee.9", "date": "2026-11-14", "timestamp": 1794641196, "text": "生育率\n23小時\n看到大家都在吵生育率、討論為什麼年輕人不生小孩，我也來講講我的親身經歷好了。\n14年前，我弟剛高中畢業去當兵，沒什麼社會經驗，被我舅舅帶去酒店認識了前妻。年輕人很容易暈船，沒多久對方懷孕生下了我侄子。後來兩人搞出一堆破事離婚，監護權歸女方，我弟當時的態度是：「好啊，妳都拿去，我才不要。」\n結果女方後來跟一個吸毒的在一起，對方會家暴，甚至被關的時候，女方還帶著我侄子去監獄探監。我媽覺得這樣下去孩子真的會被毀掉，花了一年多的時間跟大筆積蓄，才把侄子搶回身邊。剛接回來時，孩子脾氣暴躁、分離焦慮非常嚴重。", "likes": 4061, "replies": 112, "url": "https://www.threads.com/@zack.lee.9/post/DfrHmVzmpmQ", "top_comments": [], "engagement": 4173, "category": "案例分享"}, {"id": "ts_1794641210_583", "author": "2026-11-3", "handle": "169ugjuh", "date": "2026-11-03", "timestamp": 1794641210, "text": "2026-11-3\n我跟青梅竹馬告白失敗四年後，\n才知道她當年拒絕我，回家竟然哭了。\n就是上次她發現我偷偷寫這個帳號的事。\n她說，我第一次跟她告白那天，回家以後其實還發生了一件事。\n我問了好幾次，她終於肯講。\n原來那天她回家以後，整個人都怪怪的。\n她媽媽問她怎麼了。\n她一開始還說沒事。\n後來吃飯吃到一半，突然就哭了。\n她媽嚇一跳。\n「怎麼了？有人欺負妳？」\n她搖頭。\n「沒有啦。」\n她媽又問：\n「那妳哭什麼？」\n她說：\n「我剛剛拒絕他了。」\n她媽愣了一下。\n「誰？」\n她講了我的名字。\n她媽媽第一句居然是：\n「妳把他怎麼了？」\n我聽到這裡差點笑出來。\n「妳媽怎麼不先關心妳？」\n她瞪我。\n「你先聽我講完啦。」", "likes": 3602, "replies": 570, "url": "https://www.threads.com/@169ugjuh/post/DfRio1UjFUY", "top_comments": [], "engagement": 4172, "category": "案例分享"}, {"id": "ts_1794641210_135", "author": "2daisynnn", "handle": "2daisynnn", "date": "2026-11-14", "timestamp": 1794641210, "text": "21小時\n拿到大結果 對方告白了", "likes": 4080, "replies": 38, "url": "https://www.threads.com/@2daisynnn/post/DfrY-WyE_T-", "top_comments": [], "engagement": 4118, "category": "其他"}, {"id": "ts_1794641153_660", "author": "2026-11-6", "handle": "qxvn3e", "date": "2026-11-06", "timestamp": 1794641153, "text": "2026-11-6\n频繁吵架就说明两个人的关系要到头了。。", "likes": 3969, "replies": 29, "url": "https://www.threads.com/@qxvn3e/post/DfaDPGEm_0I", "top_comments": [], "engagement": 3998, "category": "抱怨"}, {"id": "ts_1794641097_542", "author": "o3_23_lu", "handle": "o3_23_lu", "date": "2026-11-14", "timestamp": 1794641097, "text": "17小時\n離婚2個月了\n親手結束12年的感情\n12年的青春 換來一堂很貴的人生課", "likes": 2992, "replies": 762, "url": "https://www.threads.com/@o3_23_lu/post/DfrwmI1ko1A", "top_comments": [], "engagement": 3754, "category": "其他"}, {"id": "ts_1794641182_543", "author": "shyanyu213", "handle": "shyanyu213", "date": "2026-11-14", "timestamp": 1794641182, "text": "2天\n我真的不確定記憶來問脆\n我明明記得邁邁當立委的時候，很兇有夠派，然後騎勁戰去立院上班摔車的新聞，現在我找不到當時的新聞\n從邁邁直播露出貓貓當陳暖男，我投了好幾次票，現在變成陳三歲\n高雄的進步，我被植入的記憶，就是邁邁有夠兇，什麼事都麻要趕快執行阿，不論是深夜打電話給實實，還是氣象預報要撤離遷村的，還是最近滑到打1999，高雄的效率有夠高(恩~韓導那時高雄路邊雜草真的好高)\n就只是想問一下，邁邁你到底有沒有摔過勁戰阿？\n@chenchimai", "likes": 3101, "replies": 135, "url": "https://www.threads.com/@shyanyu213/post/Dfm06yGic3K", "top_comments": [], "engagement": 3236, "category": "觀點爭論"}, {"id": "ts_1794641325_189", "author": "2026-10-26", "handle": "jdnegcudikwndf", "date": "2026-10-26", "timestamp": 1794641325, "text": "2026-10-26\n其实grace张的事情越到后面越觉得头皮发麻 好典的东亚氛围 一个上大学有自己经济来源的成年人博主为什么发生了这个事情之后她妈妈一直出来评论➕代替道歉 这个控制欲让我好ptsd", "likes": 3093, "replies": 99, "url": "https://www.threads.com/@jdnegcudikwndf/post/De9TyFdgZbj", "top_comments": [], "engagement": 3192, "category": "其他"}, {"id": "ts_1794641083_149", "author": "chy913_", "handle": "chy913_", "date": "2026-11-14", "timestamp": 1794641083, "text": "1天\n跟大家說一個消息\nFF票沒賣完在發公關票⋯", "likes": 3119, "replies": 58, "url": "https://www.threads.com/@chy913_/post/DfrDcz6E1Fw", "top_comments": [], "engagement": 3177, "category": "其他"}, {"id": "ts_1794641224_354", "author": "2026-1 : 2263, "category": "其他"}, {"id": "ts_1794641355_607", "author": "沈伯洋敢領養，你們藍白敢嗎?", "handle": "gyoseiki", "date": "2026-11-02", "timestamp": 1794641355, "text": "沈伯洋敢領養，你們藍白敢嗎?\n2026-11-2\n沈伯洋敢領養，你們藍白敢嗎?\n有本事出來說話啊。", "likes": 822, "replies": 1422, "url": "https://www.threads.com/@gyoseiki/post/DfQUc5Ukyg1", "top_comments": [], "engagement": 2244, "category": "其他"}, {"id": "ts_1794641355_548", "author": "2026-10-27", "handle": "tspdrshe", "date": "2026-10-27", "timestamp": 1794641355, "text": "2026-10-27\n跟大家報個平安🥰🥰\n昨天的影片可能有超過千人叫我小心人身安全，我只想說，矢板老師都不怕了，我怎麼可以退縮呢？\n身為小黨候選人，本來就該揭發別人不敢講的事，打破金權政治的勾結，才有機會讓政治環境越來越好。\n我不人身攻擊，只講真話。\n中國國民黨在內湖南港的候選人，到底跟陳啟宏有多少關係？我們這邊這麼多都更案件、土地開發，你們應該負責任，跟支持者講清楚。\n#政治 #正義 #金權政治", "likes": 2074, "replies": 124, "url": "https://www.threads.com/@tspdrshe/post/DfBVqB7l2KT", "top_comments": [], "engagement": 2198, "category": "案例分享"}, {"id": "ts_1794640983_211", "author": "男生喜歡男生", "handle": "qwer_tasd1111", "date": "2026-11-14", "timestamp": 1794640983, "text": "男生喜歡男生\n15小時\n快要交到男朋友了🥰", "likes": 2004, "replies": 50, "url": "https://www.threads.com/@qwer_tasd1111/post/DfsAARAH3O0", "top_comments": [], "engagement": 2054, "category": "其他"}, {"id": "ts_1794641040_517", "author": "she.he.story", "handle": "she.he.story", "date": "2026-11-14", "timestamp": 1794641040, "text": "18小時\n真正長久的感情，不是去尋找永遠新鮮的話題，而是願意把一天中最放鬆、最真誠的笑容，留給那個陪你過日子的人。\n放下手機，好好抱抱身邊的另一半吧。🫂\n#情感 #婚姻日常 #溫柔提醒 🌹", "likes": 2045, "replies": 0, "url": "https://www.threads.com/@she.he.story/post/Dfrqpg5EiE8", "top_comments": [], "engagement": 2045, "category": "觀點爭論"}, {"id": "ts_1794640927_674", "author": "ccy.11_", "handle": "ccy.11_", "date": "2026-11-14", "timestamp": 1794640927, "text": "21小時\n我的戀人是天蠍座\n剛認識她的時候她總是對誰都一副很客氣的模樣 冷淡但是有禮貌 後面慢慢的靠近她了卻發現我在她的心裡已經有了位置 她可以漫不經心的說出我的忌口 愛好 小習慣\n她最討厭被揣測 她說揣測這件事本身就帶著自以為是的氣味 她討厭解釋自己 因為既想證明自己又不想費盡口舌的樣子總是令她感到崩潰無力\n跟她相處一定要學會示弱\n因為她安全感薄弱 期待有人示弱 依賴她 需要她她覺得真正的感情是可以坦然的表達出自己的弱小和無力 而不是帶著偽裝給自己塑造一個完美的形象\n她說她不喜歡陷入被動的局面 這會讓她覺得恐慌她的疑心 焦慮 害怕就會無限放大 她是真的需要看得見的愛來一遍一遍的確認自己真的被愛著\n她難過的時候 總是很安靜 都說一段關係里還有爭執還有吵鬧就說明還有輓留的機會 所以我害怕她的沈默 我會一直想要她的答案\n後來我才明白 她的沈默不是對我的懲罰 也不是回避問題 而是她給自己的緩衝空間 也是她害怕講出傷人的話語所以咬緊牙關", "likes": 1972, "replies": 21, "url": "https://www.threads.com/@ccy.11_/post/DfrWa0Tmi5R", "top_comments": [], "engagement": 1993, "category": "抱怨"}, {"id": "ts_1794640927_757", "author": "qujiaxin", "handle": "qujiaxin", "date": "2026-11-14", "timestamp": 1794640927, "text": "1天\n最終還是分手了，謝謝大家。\n今天是11月13日，我們最終和平分手 。\n其實從朋友到戀人，我們發生了挺多事情\n能走到一起，也是很不容易。\n我喜歡妳 很喜歡妳，也想和妳一起幼稚。\n對啊 我總問自己為什麼還能堅持，可能没有答案。\n我沒有備胎，也不玩暖味\n我所有的脾氣愛笑愛哭都給了妳。\n我能為妳做的最後一件竟然是走出你的人生。\n我一點都不後悔，更謝謝妳能教會我成長。\n最後我也不知道這是誰寫的，\n挺感動的我就複製了下來。\n看到這裡說明妳很在乎我，\n天氣有點冷，能請我喝雙果果汁嗎？\n可以的話我要三杯，松露生巧克力蛋糕也行6寸就好。", "likes": 1831, "replies": 62, "url": "https://www.threads.com/@qujiaxin/post/DfqmpdJD8kU", "top_comments": [], "engagement": 1893, "category": "案例分享"}, {"id": "ts_1794641097_103", "author": "2026-10-31", "handle": "umav_sunavan", "date": "2026-10-31", "timestamp": 1794641097, "text": "2026-10-31\n完全就是我的感情觀！\noyamaberry2003\n2026-10-31\n喜歡你，\n這是我自己的事。\n我想這是喜歡一個人最成熟的模樣。\n喜歡你，是因為你讓我心動。\n想靠近你，是因為我欣賞你。\n想對你好，也只是因為看見你開心，我便覺得快樂。\n這些心意，不需要交換什麼，\n更不應該成為你的負擔。\n喜歡你，但不代表要擁有你。\n希望你靠近，但不會因此弄丟自己。\n真正的喜歡，\n不是想盡辦法把一個人留在身邊，\n而是即使很在乎，也願意給對方自由。\n你有你的生活，我有我的世界。\n我們不必互相填補生命裡的空缺，\n也不需要因為害怕孤單而勉強靠近。\n只是在人來人往的日子裡，\n剛好遇見了彼此，\n剛好欣賞，剛好心動，\n也剛好願意多停留一會。\n我希望你過得好，\n即使有些時候你的快樂未必與我有關。\n喜歡一個人，不是讓自己變得卑微，\n反而應該讓自己更了解自己。\n知道自己渴望什麼，也懂得尊重別人的選擇。\n或許最後沒有走到一起，\n也不代表這份喜歡沒有意義。\n至少我曾經真心地喜歡過你，\n也因為你，成為了一個更懂得愛的人。\n陪一個人，沒有目的，沒有限期。", "likes": 1850, "replies": 38, "url": "https://www.threads.com/@umav_sunavan/post/DfLcrZ7k6UI", "top_comments": [], "engagement": 1888, "category": "案例分享"}, {"id": "ts_1794641097_499", "author": "2026-10-31", "handle": "oyamaberry2003", "date": "2026-10-31", "timestamp": 1794641097, "text": "2026-10-31\n喜歡你，\n這是我自己的事。\n我想這是喜歡一個人最成熟的模樣。\n喜歡你，是因為你讓我心動。\n想靠近你，是因為我欣賞你。\n想對你好，也只是因為看見你開心，我便覺得快樂。\n這些心意，不需要交換什麼，\n更不應該成為你的負擔。\n喜歡你，但不代表要擁有你。\n希望你靠近，但不會因此弄丟自己。\n真正的喜歡，\n不是想盡辦法把一個人留在身邊，\n而是即使很在乎，也願意給對方自由。\n你有你的生活，我有我的世界。\n我們不必互相填補生命裡 const CHART_COLORS = ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});

// Punchlines
const punchlineContainer = document.getElementById('punchlineContainer');
DATA.punchlines.forEach(pl => {
  const div = document.createElement('div');
  div.className = 'punchline-card';
  div.innerHTML = `<div class="punchline-text">\u201c${pl.text}\u201d</div><div class="punchline-source">\u2014 ${pl.source} &middot; &#10084; ${pl.likes?.toLocaleString()}</div>`;
  punchlineContainer.appendChild(div);
});

// Topic horizontal bar chart
const dist = DATA.topicDistribution;
const sortedDist = Object.entries(dist).sort((a,b) => b[1] - a[1]);
new Chart(document.getElementById('topicBarChart'), {
  type: 'bar',
  data: {
    labels: sortedDist.map(([k]) => k),
    datasets: [{
      data: sortedDist.map(([,v]) => v),
      backgroundColor: ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'],
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ display:false }, title:{ display:false } },
      y:{ grid:{ display:false }, title:{ display:false } }
    }
  }
});

// Likes bar chart
const sorted = [...DATA.posts].sort((a,b) => b.likes - a.likes).slice(0,10);
const labels = sorted.map(p => (p.author || '\u533f\u540d') + ' ' + (p.text||'').slice(0,15).replace(/\n/g,' ') + '\u22ef');
new Chart(document.getElementById('likesBarChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '\u8b9a\u6578',
      data: sorted.map(p => p.likes),
      backgroundColor: '#f5a0b5',
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v } },
      y:{ grid:{ display:false }, title:{ display:false } }
    },
    layout:{ padding:{ right:40 } }
  }
});

// Topic summaries
const topicContainer = document.getElementById('topicContainer');
DATA.topicSummaries.forEach(s => {
  const div = document.createElement('div');
  div.className = 'topic-card';
  div.innerHTML = `<div class="topic-title">&#128204; ${s.topic} <span class="topic-meta">（${s.post_count} 則 · &#10084; ${s.total_likes?.toLocaleString()}）</span></div><div class="topic-summary">${s.summary}</div>`;
  topicContainer.appendChild(div);
});

// Filters
const filterContainer = document.getElementById('filterContainer');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '全部';
allBtn.dataset.filter = 'all';
filterContainer.appendChild(allBtn);
const topics = [...new Set(DATA.posts.map(p => p.category || p.category_hint || '其他'))];
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = t;
  btn.dataset.filter = t;
  filterContainer.appendChild(btn);
});

let currentFilter = 'all';
function renderPosts() {
  const filtered = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const container = document.getElementById('postListContainer');
  container.innerHTML = filtered.map((p,i) => `
    <div class="post-card">
      <h4>&#128100; ${p.author || '匿名'} <span class="meta">@${p.handle||''} &middot; ${p.date||''}</span></h4>
      <div class="text" onclick="this.classList.toggle('expanded')">${p.text}</div>
      <div class="stats">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies} &middot; ${p.category || p.category_hint || '未分類'}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往原文</a>' : ''}
    </div>
  `).join('');
  const sel = document.getElementById('postSelect');
  sel.innerHTML = filtered.map((p,i) => `<option value="${i}">&#10084;${p.likes} | ${p.author||'匿名'} | ${(p.text||'').slice(0,30)}...</option>`).join('');
  sel.onchange = () => showDetail(parseInt(sel.value));
}

filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});

function showDetail(idx) {
  const posts = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const p = posts[idx];
  if (!p) return;
  const container = document.getElementById('detailContainer');
  let comments = '';
  (p.top_comments || []).forEach(c => {
    comments += `<div class="comment"><div class="comment-author">${c.author||'匿名'}</div><div>${c.text}</div><div style="font-size:0.75rem;color:#adb5bd;">&#10084; ${c.likes}</div></div>`;
  });
  container.innerHTML = `
    <div class="detail-container">
      <h3>&#128100; ${p.author||'匿名'} <span style="font-weight:400;color:#868e96;">@${p.handle||''}</span></h3>
      <div style="font-size:0.8rem;color:#868e96;">${p.date||''} &middot; ${p.category||p.category_hint||'未分類'}</div>
      <div class="text">${p.text}</div>
      <div style="color:#212529;font-size:0.9rem;">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往 Threads 原文</a>' : ''}
      <div style="margin-top:0.8rem;font-weight:600;color:#212529;">&#128172; 熱門留言（前 ${(p.top_comments||[]).length} 則）</div>
      ${comments || '<div style="color:#adb5bd;">暫無留言資料</div>'}
    </div>
  `;
}

renderPosts();
showDetail(0);
</script>
