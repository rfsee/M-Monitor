}, {"id": "ts_1789451629_397", "author": "失去", "handle": "theunsproken", "date": "2026-09-15", "timestamp": 1789451629, "text": "失去\n17分鐘\n【上集：失去】\n躺在冰冷的手術床上，我就只餘下軀體。\n我喺一個平凡嘅小康家庭長大，讀書、打工、拍拖、結婚，生大寶。一切都波瀾不驚，順理成章。我一度以為，人生大概就會喺呢份安穩平淡之中，溫柔地延續落去。\n直到五年前，歲月喺我心頭狠狠劃下一刀，我先第一次領教到，咩叫撕心裂肺嘅切膚之痛。", "likes": 5, "replies": 0, "url": "https://www.threads.com/@theunsproken/post/DdS-VtakW-g", "top_comments": [], "engagement": 5, "category": "其他"}, {"id": "ts_1789451484_343", "author": "meta.ai", "handle": "meta.ai", "date": "2026-09-15", "timestamp": 1789451484, "text": "19小時\n正在回覆@mr_hank0927\nEk就是PTT上那個很有名的空軍，之前發文說要「放空華邦電」，說它是記憶體股裡最弱的，DDR4已經有價無市，股價會回60元基本面。\n所以「Ek放空華崩電」就是在調侃，因為他一喊空，華邦電就崩了，大家就把華邦電叫成華崩電。\n今天剛好就是這樣，記憶體族群被日本鎧俠示警漲夠了+美AI放緩消息帶衰，美光/SanDisk先跌，華邦電今天盤中直接殺到160元、跌逾6%。", "likes": 1, "replies": 2, "url": "https://www.threads.com/@meta.ai/post/DdQ3CntALc3", "top_comments": [], "engagement": 3, "category": "案例分享"}, {"id": "ts_1789451529_768", "author": "南亞科 台股", "handle": "wangyuho518", "date": "2026-09-15", "timestamp": 1789451529, "text": "南亞科 台股\n1 分鐘\n從 569 殺到 465，南亞科這一刀，到底是黃金坑還是斷頭鍘？", "likes": 3, "replies": 0, "url": "https://www.threads.com/@wangyuho518/post/DdTAHhNlNQi", "top_comments": [], "engagement": 3, "category": "觀點爭論"}, {"id": "ts_1789451587_789", "author": "路竹美食", "handle": "line0983431122", "date": "2026-09-15", "timestamp": 1789451587, "text": "路竹美食\n1 分鐘\n9/15（二）\n高雄市路竹區中和街178號\n下午4點開始\n直接過來買就好了\n好辛苦\n我真的快中暑🥵了啦⋯⋯\n堅持現煮搞死自己😭\n開煮了啦～～", "likes": 1, "replies": 2, "url": "https://www.threads.com/@line0983431122/post/DdTAEDxCYSL", "top_comments": [], "engagement": 3, "category": "其他"}, {"id": "ts_1789451615_712", "author": "高雄租屋", "handle": "margaux39685", "date": "2026-09-15", "timestamp": 1789451615, "text": "高雄租屋\n1 分鐘\n📍 地址：高雄市鳳山區和德街151號\n租屋補助：可申請\n寵物友善：可寵\n輕鬆下廚：天然氣開伙 ☑️\n🏠 格局：1 房 / 1 衛 / 1陽台\n隨時可看房", "likes": 1, "replies": 2, "url": "https://www.threads.com/@margaux39685/post/DdTAOdBo_px", "top_comments": [], "engagement": 3, "category": "其他"}, {"id": "ts_178945164 kkwwtww33/post/DdTAf1Rkm3M", "top_comments": [], "engagement": 2, "category": "觀點爭論"}, {"id": "ts_1789451802_285", "author": "南亞科2408", "handle": "zhangwei90747", "date": "2026-09-15", "timestamp": 1789451802, "text": "南亞科2408\n1 分鐘\n正在回覆@zhangwei90747\n國際那邊，其實才是真正的戲\n昨天晚上美股那場屠殺，你們看了沒有？\n費城半導體指數直接重挫 5.86%，創下 7 月 1 日以來最大跌幅，30 檔成分股全部收綠，沒有一檔倖免。台積電 ADR 跌 3.52%，英偉達跌超過 3%，SK 海力士更誇張，一夜暴跌 7.6%，市值蒸發超過一兆台幣。光通信那邊更慘，康寧直接噴 13%，Coherent 跌 12%，跟著黃仁勳吃大肉的人，昨天晚上大概都在吞降血壓藥。\n原因是什麼？講穿了就三件事。", "likes": 2, "replies": 0, "url": "https://www.threads.com/@zhangwei90747/post/DdTAlDwlCAk", "top_comments": [], "engagement": 2, "category": "觀點爭論"}, {"id": "ts_1789451816_643", "author": "借貸", "handle": "wangyiting5579", "date": "2026-09-15", "timestamp": 1789451816, "text": "借貸\n1 分鐘\n45萬 月繳納9000 實拿 免保人", "likes": 1, "replies": 1, "url": "https://www.threads.com/@wangyiting5579/post/DdTAqFHkdg3", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451816_942", "author": "即興劇", "handle": "yuling_the_improv_witch", "date": "2026-09-15", "timestamp": 1789451816, "text": "即興劇\n1 分鐘\n我最近帶領了連續兩週共4hr的課程\n與 #蒲公英聽語協會 和 #果陀文創 合作的\n「Yes,and! 沒劇本的表演課」即興劇體驗工作坊\n敲定合作大約是年初\n接下來因為心裡一直放著這件事\n不管上什麼課、或碰到前輩有機會請教時\n所得到的也都漸漸化成備課的養分\n我想分享幾個對我很有幫助的事\n感覺寫起來會很長，先寫第一個～\n去馬尼拉即興節時上到一堂共融課程\n一半視障人士、一半即興演員、還有一位坐輪椅的朋友\n再加上大家來自各國，也會多少有些語言上的挑戰\n而這堂課給我很大的啟發", "likes": 2, "replies": 0, "url": "https://www.threads.com/@yuling_the_improv_witch/post/DdTAoQKmV_5", "top_comments": [], "engagement": 2, "category": "案例分享"}, {"id": "ts_1789451836_336", "author": "1 分鐘", "handle": "yatzkan6", "date": "2026-09-15", "timestamp": 1789451836, "text": "1 分鐘\n恭喜各位，這次是真的要噴了🎉", "likes": 2, "replies": 0, "url": "https://www.threads.com/@yatzkan6/post/DdTArK9EyQp", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451878_217", "author": "借貸", "handle": "wangyiqian185", "date": "2026-09-15", "timestamp": 1789451878, "text": "借貸\n1 分鐘\n三十萬月繳 5900 有需要嗎", "likes": 1, "replies": 1, "url": "https://www.threads.com/@wangyiqian185/post/DdTAvHCj9h4", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451878_475", "author": "1 分鐘", "handle": "elk.50791217", "date": "2026-09-15", "timestamp": 1789451878, "text": "1 分鐘\n這身材太燒了\n穿个瑜伽褲怎麼中間一條縫\n好難受\n圖在1F", "likes": 2, "replies": 0, "url": "https://www.threads.com/@elk.50791217/post/DdTAuLKEv41", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451893_705", "author": "1 分鐘", "handle": "jellyfish_31329871", "date": "2026-09-15", "timestamp": 1789451893, "text": "1 分鐘\n剛上大一妹妹不按套路出牌\n軍訓服的拉鍊都拉不上\n露出一片雪白\n圖丟1樓", "likes": 2, "replies": 0, "url": "https://www.threads.com/@jellyfish_31329871/post/DdTAy1SGiuR", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451908_353", "author": "魔獸世界", "handle": "agdsyygyuyu", "date": "2026-09-15", "timestamp": 1789451908, "text": "魔獸世界\n1 分鐘\n暴雪在前幾天的暴雪嘉年華公布了《魔獸世界：永恆》\n全新遊戲體驗版本，將等級上限永遠定格於 60 級並主打橫向擴充\n其實講簡單一點就是魔獸爭霸3的時間縣的平行宇宙世界觀\n所以不會有燃燒軍團跟巫妖王那些\n然後新增全新地圖/天裔種族(換皮血精靈)/新地下城/新團本/新任務/新系統的遊戲\n講簡單一點就以經典版為主添加了正式服以及賽季服等其他不同服的綜合體\n算是第三款魔獸世界\n當年經典剛開的時候許多人說多好玩多好玩的\n當初確實也是一堆人來玩 包含許多實況主\n但後來因為蝗蟲太多以及節奏太慢加上沒什麼內容導致許多人覺得不如預期退坑\n但這個版本雖然以經典版為主但新增了許多內容\n所以應該不會像是當初一樣讓人覺得可能有點無聊\n我猜到時候應該還是會很多人玩\n說不定一些以前玩過經典版的圖奇那些實況主也會一起回來玩\n上市時間：預計於台灣時間 2026 年 11 月 5 日 全球正式上市\n如果有買官網1800以上的禮包的話9/18號可以優先體驗刪檔測試版\n順便宣傳一下玩家LINE群跟DC群\n連結我貼在至頂留言", "likes": 2, "replies": 0, "url": "https://www.threads.com/@agdsyygyuyu/post/DdTA0Q4iaoK", "top_comments": [], "engagement": 2, "category": "案例分享"}, {"id": "ts_1789451908_536", "author": "1 分鐘", "handle": "vanh_daubuoi", "date": "2026-09-15", "timestamp": 1789451908, "text": "1 分鐘\n我炒股養家，玩股10年，從20萬滾到3200萬，我只守住這8條", "likes": 2, "replies": 0, "url": "https://www.threads.com/@vanh_daubuoi/post/DdTA1dOn4gG", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451922_908", "author": "1 分鐘", "handle": "goat.5409455", "date": "2026-09-15", "timestamp": 1789451922, "text": "1 分鐘\n媽咪喜歡無罩駕駛\n但穿這件裙子出門 都擔心走光…\n圖在1F", "likes": 2, "replies": 0, "url": "https://www.threads.com/@goat.5409455/post/DdTA2wHEh_j", "top_comments": [], "engagement": 2, "category": "其他"}, {"id": "ts_1789451484_655", "author": "3分鐘", "handle": "meta.ai", "date": "2026-09-15", "timestamp": 1789451484, "text": "3分鐘\n正在回覆@facai6463\n這種被包圍、只能看風向的感覺，確實會讓人很累。\n台灣藍綠白各陣營都有自己的同溫層、口號跟動員方式，當資訊都帶著立場時，很容易覺得都是洗腦。\n比較實際的做法還是回到可驗證的事，有具體來源、數據、金流的就看證據，沒有的就先當作是政治攻防的標籤，會比較不容易被帶著走。", "likes": 1, "replies": 0, "url": "https://www.threads.com/@meta.ai/post/DdS_tJXEeOx", "top_comments": [], "engagement": 1, "category": "其他"}, {"id": "ts_1789451484_793", "author": "1 分鐘", "handle": "facai6463", "date": "2026-09-15", "timestamp": 1789451484, "text": "1 分鐘\nmeta.ai\n如果你愛看風向球，也是你選擇了，大家觀點不同而己，不會影響到你的觀點", "likes": 1, "replies": 0, "url": "https://www.threads.com/@facai6463/post/DdS__2Ykos0", "top_comments": [], "engagement": 1, "category": "其他"}, {"id": "ts_1789451484_255", "author": "蝦皮", "handle": "fushanliao", "date": "2026-09-15", "timestamp": 1789451484, "text": "蝦皮\n1 分鐘\n很多人問我：「你最近都不發文，是不是偷偷跑去發大財？」\n發大財沒有，差點被公司帳本氣到中風倒是真的。 這半年我推掉應酬，在公司帶一個不睡覺、不支薪的「AI 助理」，把「MPB 巴黎小姐」跟「時尚Q美睫」的後台數據徹底洗了一遍。\n【反常識思維：老闆每天哭沒流量，其實是你自己把客人嚇跑；每天喊窮，是你把淨利拿去繳系統商的過路費！】\n翻開後台，抓出兩個最痛的翻車現場： 蝦皮 99% 的客人都死在不敢開口：AI 分析 2,246 筆對話發現，只要客人開口問，成交率飆 5 倍！ 但絕大多數人看不懂就默默滑掉。\n我立刻把罐頭訊息改成：「想染髮不知道怎麼選？ 傳髮色照片來，客服幫你挑！」 再讓 AI 自動生成 23 則痛點快覆草稿，真人客服一鍵確認發送，一毛廣告費沒多花，轉換率直接翻倍。\n擋下軟體商 3萬塊 API 過路費：進銷存對接倉儲，軟體公司開口要 6 萬串接費。 我叫 AI 摸出一條免費路徑：自動匯出報表再自動匯入系統，零成本搞定，把 6/3萬現金硬生生留在戶頭。 半年搞了 210 次系統升級，連選品算利潤、產短影音腳本都自動化。", "likes": 1, "replies": 0, "url": "https://www.threads.com/@fushanliao/post/DdS_-ftDyDL", "top_comments": [], "engagement": 1, "category": "工具推薦"}, {"id": "ts_1789451484_896", "author": "1 分鐘", "handle": "loki0230", "date": "2026-09-15", "timestamp": 1789451484, "text": "1 分鐘\nmeta.ai\n笑麻了", "likes": 1, "replies": 0, "url": "https://www.threads.com/@loki0230/post/DdS_9rGE3MX", "top_comments": [], "engagement": 1, "category": "其他"}, {"id": "ts_1789451499_963", "author": "1 分鐘", "handle": "ecofresh_organics", "date": "2026-09-15", "timestamp": 1789451499, "text": "1 分鐘\n正在回覆@ecofresh_organics\n一個，開盤急拉——以前我都是追，現在我等。\n以前我有個壞毛病，九點開盤看到股票急拉就興奮，覺得不追會錯過行情。有一檔印象很深刻，開盤五分鐘拉了快五趴，我市價追進去，結果二十分鐘後直線翻黑，當天賠了二十三萬。後來這種事反覆發生，我才慢慢摸出一個規律。\n急拉的時候要看兩件事。第一，預估量有沒有比昨天大。如果預估量是萎縮的，這種急拉大概就主力在試水溫，沒人跟就會掉下來。第二，拉完之後會不會回測，如果急拉那根紅K的低點被跌破，代表拉抬力道沒了，這時候反而可以看看空單的機會。\n我現在最常做的反而是開盤前五分鐘完全不下單。以前覺得這樣會錯過行情，後來發現錯過的幾乎都是賠錢行情。先讓子彈飛一下，看清楚今天誰是老大再說。", "likes": 1, "replies": 0, "url": "https://www.threads.com/@ecofresh_organics/post/DdTADlImhCN", "top_comments": [], "engagement": 1, "category": "案例分享"}, {"id": "ts_1789451499_288", "author": "1 分鐘", "handle": "ecofresh_organics", "date": "2026-09-15", "timestamp": 1789451499, "text": "1 分鐘\n二個，盤中爆量但價格卡住——這種最陰，我以前死最慘。\n有一陣子我專門找爆量的股票，覺得量放大代表有人在動，跟進去就對了。結果最常碰到一種情況：量爆出來了，價格卻卡在那邊不動，上下不到半趴。我以為是洗盤，加碼進去，結果一路慢慢往下走，最後受不了砍掉，單筆賠了八十六萬。\n後來才看懂，爆量不漲叫出貨，爆量不跌叫吃貨。遇到這種情況，我現在會做一個很簡單的判斷：爆量之後給它五分鐘，如果價格還是過不了那根爆量K棒的高點，大概就是出貨了，我不會再去接。反過來說，如果爆量之後價格跌不下去，連續幾根K棒的低點都在抬高，可能是有人在吃貨，可以考慮進場跟一段。\n最重要的原則是：爆量當下絕對不進場。等它走完、看清楚方向再說。", "likes": 1, "replies": 0, "url": "https://www.threads.com/@ecofresh_organics/post/DdTAECLmrXM", "top_comments": [], "engagement": 1, "category": "抱怨"}, {"id": "ts_1789451499_520", "author": "1 分鐘", "handle": "jero41354", "date": "2026-09-15", "timestamp": 1789451499, "text": "1 分鐘\n才20岁呢\n已经被训练到一碰就溜水了\n越南🇻🇳胡志明五郡", "likes": 1, "replies": 0, "url": "https://www.threads.com/@jero41354/post/DdTACmfE0KB", "top_comments": [], "engagement": 1, "category": "其他"}, {"id": "ts_1789451514_628", "author": "馬鹿と野郎", "handle": "kate70723", "date": "2026-09-15", "timestamp": 1789451514, "text": "馬鹿と野郎\n1 分鐘\n募資突破300萬了🎉", "likes": 1, "replies": 0, "url": "https://www.threads.com/@kate70723/post/DdTACD2Cet5", "top_comments": [], "engagement": 1, "category": "其他"}, {"id": "ts_1789451514_946", "author": "1 分鐘", "handle": "otter.76356347", "date": "2026-09-15", "timestamp": 1789451514, "text": "1 分鐘\n宜蘭\n可以見一面嗎\n做什麼都可以\n我有空", "likes": 1, "replies": 0, "url": "https://www.threads.com/@otter.76356347/post/DdTAEKjGwKq", "to const CHART_COLORS = ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});

// Punchlines
const punchlineContainer = document.getElementById('punchlineContainer');
DATA.punchlines.forEach(pl => {
  const div = document.createElement('div');
  div.className = 'punchline-card';
  div.innerHTML = `<div class="punchline-text">\u201c${pl.text}\u201d</div><div class="punchline-source">\u2014 ${pl.source} &middot; &#10084; ${pl.likes?.toLocaleString()}</div>`;
  punchlineContainer.appendChild(div);
});

// Topic horizontal bar chart
const dist = DATA.topicDistribution;
const sortedDist = Object.entries(dist).sort((a,b) => b[1] - a[1]);
new Chart(document.getElementById('topicBarChart'), {
  type: 'bar',
  data: {
    labels: sortedDist.map(([k]) => k),
    datasets: [{
      data: sortedDist.map(([,v]) => v),
      backgroundColor: ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'],
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ display:false }, title:{ display:false } },
      y:{ grid:{ display:false }, title:{ display:false } }
    }
  }
});

// Likes bar chart
const sorted = [...DATA.posts].sort((a,b) => b.likes - a.likes).slice(0,10);
const labels = sorted.map(p => (p.author || '\u533f\u540d') + ' ' + (p.text||'').slice(0,15).replace(/\n/g,' ') + '\u22ef');
new Chart(document.getElementById('likesBarChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '\u8b9a\u6578',
      data: sorted.map(p => p.likes),
      backgroundColor: '#f5a0b5',
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v } },
      y:{ grid:{ display:false }, title:{ display:false } }
    },
    layout:{ padding:{ right:40 } }
  }
});

// Topic summaries
const topicContainer = document.getElementById('topicContainer');
DATA.topicSummaries.forEach(s => {
  const div = document.createElement('div');
  div.className = 'topic-card';
  div.innerHTML = `<div class="topic-title">&#128204; ${s.topic} <span class="topic-meta">（${s.post_count} 則 · &#10084; ${s.total_likes?.toLocaleString()}）</span></div><div class="topic-summary">${s.summary}</div>`;
  topicContainer.appendChild(div);
});

// Filters
const filterContainer = document.getElementById('filterContainer');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '全部';
allBtn.dataset.filter = 'all';
filterContainer.appendChild(allBtn);
const topics = [...new Set(DATA.posts.map(p => p.category || p.category_hint || '其他'))];
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = t;
  btn.dataset.filter = t;
  filterContainer.appendChild(btn);
});

let currentFilter = 'all';
function renderPosts() {
  const filtered = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const container = document.getElementById('postListContainer');
  container.innerHTML = filtered.map((p,i) => `
    <div class="post-card">
      <h4>&#128100; ${p.author || '匿名'} <span class="meta">@${p.handle||''} &middot; ${p.date||''}</span></h4>
      <div class="text" onclick="this.classList.toggle('expanded')">${p.text}</div>
      <div class="stats">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies} &middot; ${p.category || p.category_hint || '未分類'}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往原文</a>' : ''}
    </div>
  `).join('');
  const sel = document.getElementById('postSelect');
  sel.innerHTML = filtered.map((p,i) => `<option value="${i}">&#10084;${p.likes} | ${p.author||'匿名'} | ${(p.text||'').slice(0,30)}...</option>`).join('');
  sel.onchange = () => showDetail(parseInt(sel.value));
}

filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});

function showDetail(idx) {
  const posts = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const p = posts[idx];
  if (!p) return;
  const container = document.getElementById('detailContainer');
  let comments = '';
  (p.top_comments || []).forEach(c => {
    comments += `<div class="comment"><div class="comment-author">${c.author||'匿名'}</div><div>${c.text}</div><div style="font-size:0.75rem;color:#adb5bd;">&#10084; ${c.likes}</div></div>`;
  });
  container.innerHTML = `
    <div class="detail-container">
      <h3>&#128100; ${p.author||'匿名'} <span style="font-weight:400;color:#868e96;">@${p.handle||''}</span></h3>
      <div style="font-size:0.8rem;color:#868e96;">${p.date||''} &middot; ${p.category||p.category_hint||'未分類'}</div>
      <div class="text">${p.text}</div>
      <div style="color:#212529;font-size:0.9rem;">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往 Threads 原文</a>' : ''}
      <div style="margin-top:0.8rem;font-weight:600;color:#212529;">&#128172; 熱門留言（前 ${(p.top_comments||[]).length} 則）</div>
      ${comments || '<div style="color:#adb5bd;">暫無留言資料</div>'}
    </div>
  `;
}

renderPosts();
showDetail(0);
</script>
