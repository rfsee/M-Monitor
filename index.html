, "timestamp": 1794034368, "text": "20小時\n出軌影片事件也能吵我是真沒想到ㄟ\n我不會覺得公審出軌的前任是一件很不好的事情欸，只是讓大家知道他做了什麼事情，沒有過當的辱罵跟攻擊，沒有煽動網友肉搜、威脅這樣為什麼不行？\n如果一個人的行為被公開，就足以使他面臨許多攻擊及審判，那是否意味著，這行為以群眾的價值觀來說是非常不恰當的呢？\n若是「公審」這個行為都要被譴責，那這些被辜負的人要去哪尋求公平正義ㄚ？那那些犯過錯的人就什麼都不用承擔嗎？\n若我們認為受害者不應該公開加害者的行為，那我們是否正在要求受害者替加害者維護名譽？", "likes": 1259, "replies": 58, "url": "https://www.threads.com/@louis0429/post/DfZapKxktQy", "top_comments": [], "engagement": 1317, "category": "案例分享"}, {"id": "ts_1794034255_749", "author": "mamacook72", "handle": "mamacook72", "date": "2026-11-07", "timestamp": 1794034255, "text": "16小時\n想問問大家，如果跟男友在一起快七年，雙方一直都知道彼此的手機密碼，也從來沒有不能看手機的問題。\n但最近一次一起去日本玩 5 天 4 夜，我卻發現他一直在跟同一個人聊天，而且只要我靠近他、看他一眼，甚至只是轉頭，他就會立刻把聊天室關掉。\n而且這件事情在整趟旅行中反覆發生。\n我原本不想破壞兩個人的旅行，所以一直忍著沒有說。\n當回到台灣，我終於忍不住第三次要求看他的手機。\n結果，他拒絕了。\n而且他反應非常大，帶著惱羞。\n這是我們在一起快七年以來，他第一次不讓我看手機。\n想知道大家會怎麼看這件事？", "likes": 950, "replies": 300, "url": "https://www.threads.com/@mamacook72/post/DfZzBBvDxr8", "top_comments": [], "engagement": 1250, "category": "案例分享"}, {"id": "ts_1794034397_761", "author": "ethan_tseng13", "handle": "ethan_tseng13", "date": "2026-11-07", "timestamp": 1794034397, "text": "23小時\n哇噻\n37天結婚四次\n哈哈哈哈\n奇葩", "likes": 1173, "replies": 72, "url": "https://www.threads.com/@ethan_tseng13/post/DfZDWKjEytg", "top_comments": [], "engagement": 1245, "category": "幽默梗"}, {"id": "ts_1794034641_517", "author": "2026-10-30", "handle": "kingzomzhang", "date": "2026-10-30", "timestamp": 1794034641, "text": "2026-10-30\n有时候很想问一下老卡的生长环境到底是怎么样的，真的很少见一个女性意识很强的女子身上会有顺直男的气息，而且是很标准的顺直男", "likes": 1079, "replies": 60, "url": "https://www.threads.com/@kingzomzhang/post/DfHGptyG0WR", "top_comments": [], "engagement": 1139, "category": "觀點爭論"}, {"id": "ts_1794034368_306", "author": "acltvcin__", "handle": "acltvcin__", "date": "2026-11-07", "timestamp": 1794034368, "text": "22小時\n版面已經被香港出軌事件佔據了\n我平常是一個很chill很樂天的人\n但第一次看到那個影片的時候我整個人僵住\n直視著男主\n滿腦子都想著他現在該有多難過\n但卻又能保持著自己的風度\n那瞬間我真的都快忘記呼吸\n只希望出軌的人越來越早死 一輩子都得不到幸福\n被傷害的人也終究會好起來 遇到那個值得的人。\n啊我暫時不要開脆了 看到我快憂鬱症。", "likes": 1085, "replies": 5, "url": "https://www.threads.com/@acltvcin__/post/DfZI2CRE28k", "top_comments": [], "engagement": 1090, "category": "案例分享"}, {"id": "ts_1794034540_243", "author": "純情大作戰", "handle": "tt._.ya", "date": "2026-11-07", "timestamp": 1794034540, "text": "純情大作戰\n14小時\n「我要的自始至終只有一個妳」\n讓人想到《三生三世十里桃花》夜華對白淺那夜放手一搏的吐露\n但這是《純情大作戰》白道樺對沈受愛的慘白告白\n我們道樺到底輸在哪啊啊啊啊啊\n還有受愛的寫的小說《我成為了凡爾賽的黑玫瑰》就是一部給男二上位的同人小說啊…為何現實卻是依然不給男二一個機會呢", "likes": 1031, "replies": 23, "url": "https://www.threads.com/@tt._.ya/post/DfaDIkUH3Kb", "top_comments": [], "engagement": 1054, "category": "案例分享"}, {"id": "ts_1794034284_356", "author": "56分鐘", "handle": "_maggie_love_life", "date": "2026-11-07", "timestamp": 1794034284, "text": "56分鐘\n跟深藍老公生活好辛苦\n（今年以前我深藍所以以為三觀契合）\n他只會說沈伯洋講話很空\n很像他以前軍中的長官\n但蔣萬安有多好他也說不出來\n只說今年選舉他也不想出門投票\n一直說我政治狂熱洗腦小孩\n還說我幹嘛逼他跟我一樣要喜歡沈伯洋\n我說我只是希望你去了解沈伯洋完整的論述\n他回我他也沒有逼我聽台北安可那些\n心好累", "likes": 661, "replies": 194, "url": "https://www.threads.com/@_maggie_love_life/post/DfbengCEg8k", "top_comments": [], "engagement": 855, "category": "抱怨"}, {"id": "ts_1794034397_736", "author": "感情", "handle": "sonplay", "date": "2026-11-07", "timestamp": 1794034397, "text": "感情\n7小時\n問一個很現實問題\n當你已經40+\n單身、有車、有房、有存款、無負債\n還會想找結婚對象嗎？\n我是不會", "likes": 470, "replies": 311, "url": "https://www.threads.com/@sonplay/post/Dfay1qLAf5e", "top_comments": [], "engagement": 781, "category": "其他"}, {"id": "ts_1794034483_148", "author": "2026-10-18", "handle": "syyylvvvia_", "date": "2026-10-18", "timestamp": 1794034483, "text": "2026-10-18\n他们吵架都在吵什么啊🫪可好奇啊\njounharu_\n2026-10-18\n不是好好笑 所以小篤這天真的吵架了嗎哈哈哈哈\n昨天那個花絮裡面 明明兩個人站在一起\n平時可能會貼上去了\n但這天兩個人隔著那個距離\n像隔了一條銀河一樣 沒有任何對視\n連宣傳a nation的影片都感覺氣氛有點微妙\n還有那天的dive into you 他們沒有一起唱\n不知道是不是真的吵架🤣🤣", "likes": 752, "replies": 8, "url": "https://www.threads.com/@syyylvvvia_/post/Deo1PLxCkGA", "top_comments": [], "engagement": 760, "category": "幽默梗"}, {"id": "ts_1794034483_572", "author": "2026-10-18", "handle": "jounharu_", "date": "2026-10-18", "timestamp": 1794034483, "text": "2026-10-18\n不是好好笑 所以小篤這天真的吵架了嗎哈哈哈哈\n昨天那個花絮裡面 明明兩個人站在一起\n平時可能會貼上去了\n但這天兩個人隔著那個距離\n像隔了一條銀河一樣 沒有任何對視\n連宣傳a nation的影片都感覺氣氛有點微妙\n還有那天的dive into you 他們沒有一起唱\n不知道是不是真的吵架🤣🤣", "likes": 752, "replies": 8, "url": "https://www.threads.com/@jounharu_/post/Deow1Mkkw0T", "top_comments": [], "engagement": 760, "category": "幽默梗"}, {"id": "ts_1794034611_151", "author": "星座", "handle": "star.8tarot", "date": "2026-11-07", "timestamp": 1794034611, "text": "星座\n20小時\n📣 2026.11.07｜好運爆棚星座 Top 5\n（參考太陽、上升）\n✦ 今日主題\n這個週末適合重新找回生活的樂趣。\n◆ Top 5：處女座\n最近想整理房間、清掉待辦事項的處女，今天很適合動手，先前找不到的東西或一直沒處理好的小問題，可能在整理過程中找到答案，把生活打理舒服，週末也能過得更好。\n◆ Top 4：巨蟹座\n今天很適合把時間留給親近的人，和家人吃頓飯、陪伴另一半，聯絡許久沒見的朋友都能帶來溫暖的感受，近期有些疏遠的關係，也適合從一句簡單的問候重新開始。\n◆ Top 3：雙子座\n今天的好運來自新鮮的體驗，臨時起意的活動、朋友推薦的地方，都可能讓你玩得比預期開心，正在尋找創作靈感的雙子，也適合接觸不同的事物。\n◆ Top 2：牡羊座\n今天的牡羊特別有活力，適合安排約會、參加喜歡的活動或完成一直想做的計畫，你的熱情容易帶動身邊的人，單身者也可能因為共同興趣，和某個人聊得特別投緣。", "likes": 702, "replies": 13, "url": "https://www.threads.com/@star.8tarot/post/DfZYRTXE2Fn", "top_comments": [], "engagement": 715, "category": "工具推薦"}, {"id": "ts_1794034284_184", "author": "eason_2299", "handle": "eason_2299", "date": "2026-11-07", "timestamp": 1794034284, "text": "6天\n愛情的絕緣體", "likes": 588, "replies": 83, "url": "https://www.threads.com/@eason_2299/post/DfLnDF_jmXJ", "top_comments": [], "engagement": 671, "category": "其他"}, {"id": "ts_1794034284_955", "author": "38分鐘", "handle": "_maggie_love_life", "date": "2026-11-07", "timestamp": 1794034284, "text": "38分鐘\n謝謝脆友力挺\n說時遲那時快\n剛剛可能老公發現我太難過了\n他竟然line我說要投沈伯洋了\n😭😭😭😭😭😭\n他就在我旁邊欸\n害我現在在捷運上大哭\n😭😭😭😭😭\n愛情超越了黨派！", "likes": 499, "replies": 37, "url": "https://www.threads.com/@_maggie_love_life/post/DfbgqqxEpyF", "top_comments": [], "engagement": 536, "category": "抱怨"}, {"id": "ts_1794034468_618", "author": "152_2553", "handle": "152_2553", "date": "2026-11-07", "timestamp": 1794034468, "text": "22小時\n如果一個人真的喜歡你，會忙到一天都不回訊息嗎？想聽聽大家的看法。", "likes": 404, "replies": 131, "url": "https://www.threads.com/@152_2553/post/DfZKEElk6pR", "top_comments": [], "engagement": 535, "category": "其他"}, {"id": "ts_1794034671_435", "author": "#iphone捷徑", "handle": "qwqqqq", "date": "2026-11-07", "timestamp": 1794034671, "text": "#iphone捷徑\n6天\n有沒有人跟我一樣，覺得 CarPlay 連線成功的瞬間，應該要有個帥一點的登場音效🤣\n最近研究 iPhone 捷徑，終於搞出一個自己超滿意的功能：\n🚗 上車連接 CarPlay，自動播放開機音效\n🤖 可以放變形金剛、鋼彈、機甲啟動之類的音效 影片是用titanfall 2的做示範\n🎲 每次隨機播放一首，而且不會重複，全部播完才重新洗牌\n完全不用手動操作，上車就自動觸發。\n雖然根本不是什麼必要功能，但每次上車都有種準備出擊的儀式感😂\n有人也會在搞這種奇怪但很爽的小功能嗎？", "likes": 483, "replies": 44, "url": "https://www.threads.com/@qwqqqq/post/DfKT5Oyj_OH", "top_comments": [], "engagement": 527, "category": "觀點爭論"}, {"id": "ts_1794034440_851", "author": "glucccose_q", "handle": "glucccose_q", "date": "2026-11-07", "timestamp": 1794034440, "text": "21小時\n看谁在人际交往里最容易吃亏，第一看上升，第二看金星。\n上升是看你对外的防御机制，金星是看你怎么处理人际关系。\n如果你是上升强金星弱的，比如上升天蝎配金处女，那就是外表看着像个狠人，生人勿近，其实内心特别渴望讨好别人，在人际交往里放不开。\n反过来，如果是上升弱金星强的，比如上升双鱼配金天秤，那就是表面上谁都觉得你好欺负，老好人一个，但实际上你心里门儿清，社交手腕极高，谁对你有用你门儿清，绝不会让自己吃大亏。\n最吃亏的是升金双弱，尤其是落在处女或巨蟹，跟人打交道总是小心翼翼的，害怕得罪人，结果往往是被边缘化或者被当枪使。\n如果是升金双强，比如上升狮子配金牛，那就是社交场上的高段位玩家，既能展现自己的魅力，又能实实在在地捞到好处。\n相对偏强的上升：天蝎 狮子 摩羯 白羊 水瓶\n相对偏弱的上升：双鱼 巨蟹 天秤 双子 金牛 处女\n射手座中立能量多一点\n相对偏强的金星：金牛 天秤 双鱼\n相对偏弱的金星：白羊 天蝎 处女\n其他都是中立能量", "likes": 468, "replies": 28, "url": "https://www.threads.com/@glucccose_q/post/DfZPV__n9XY", "top_comments": [], "engagement": 496, "category": "其他"}],

const CHART_COLORS = ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});

// Punchlines
const punchlineContainer = document.getElementById('punchlineContainer');
DATA.punchlines.forEach(pl => {
  const div = document.createElement('div');
  div.className = 'punchline-card';
  div.innerHTML = `<div class="punchline-text">\u201c${pl.text}\u201d</div><div class="punchline-source">\u2014 ${pl.source} &middot; &#10084; ${pl.likes?.toLocaleString()}</div>`;
  punchlineContainer.appendChild(div);
});

// Topic horizontal bar chart
const dist = DATA.topicDistribution;
const sortedDist = Object.entries(dist).sort((a,b) => b[1] - a[1]);
new Chart(document.getElementById('topicBarChart'), {
  type: 'bar',
  data: {
    labels: sortedDist.map(([k]) => k),
    datasets: [{
      data: sortedDist.map(([,v]) => v),
      backgroundColor: ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'],
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ display:false }, title:{ display:false } },
      y:{ grid:{ display:false }, title:{ display:false } }
    }
  }
});

// Likes bar chart
const sorted = [...DATA.posts].sort((a,b) => b.likes - a.likes).slice(0,10);
const labels = sorted.map(p => (p.author || '\u533f\u540d') + ' ' + (p.text||'').slice(0,15).replace(/\n/g,' ') + '\u22ef');
new Chart(document.getElementById('likesBarChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '\u8b9a\u6578',
      data: sorted.map(p => p.likes),
      backgroundColor: '#f5a0b5',
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v } },
      y:{ grid:{ display:false }, title:{ display:false } }
    },
    layout:{ padding:{ right:40 } }
  }
});

// Topic summaries
const topicContainer = document.getElementById('topicContainer');
DATA.topicSummaries.forEach(s => {
  const div = document.createElement('div');
  div.className = 'topic-card';
  div.innerHTML = `<div class="topic-title">&#128204; ${s.topic} <span class="topic-meta">（${s.post_count} 則 · &#10084; ${s.total_likes?.toLocaleString()}）</span></div><div class="topic-summary">${s.summary}</div>`;
  topicContainer.appendChild(div);
});

// Filters
const filterContainer = document.getElementById('filterContainer');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '全部';
allBtn.dataset.filter = 'all';
filterContainer.appendChild(allBtn);
const topics = [...new Set(DATA.posts.map(p => p.category || p.category_hint || '其他'))];
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = t;
  btn.dataset.filter = t;
  filterContainer.appendChild(btn);
});

let currentFilter = 'all';
function renderPosts() {
  const filtered = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const container = document.getElementById('postListContainer');
  container.innerHTML = filtered.map((p,i) => `
    <div class="post-card">
      <h4>&#128100; ${p.author || '匿名'} <span class="meta">@${p.handle||''} &middot; ${p.date||''}</span></h4>
      <div class="text" onclick="this.classList.toggle('expanded')">${p.text}</div>
      <div class="stats">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies} &middot; ${p.category || p.category_hint || '未分類'}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往原文</a>' : ''}
    </div>
  `).join('');
  const sel = document.getElementById('postSelect');
  sel.innerHTML = filtered.map((p,i) => `<option value="${i}">&#10084;${p.likes} | ${p.author||'匿名'} | ${(p.text||'').slice(0,30)}...</option>`).join('');
  sel.onchange = () => showDetail(parseInt(sel.value));
}

filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});

function showDetail(idx) {
  const posts = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const p = posts[idx];
  if (!p) return;
  const container = document.getElementById('detailContainer');
  let comments = '';
  (p.top_comments || []).forEach(c => {
    comments += `<div class="comment"><div class="comment-author">${c.author||'匿名'}</div><div>${c.text}</div><div style="font-size:0.75rem;color:#adb5bd;">&#10084; ${c.likes}</div></div>`;
  });
  container.innerHTML = `
    <div class="detail-container">
      <h3>&#128100; ${p.author||'匿名'} <span style="font-weight:400;color:#868e96;">@${p.handle||''}</span></h3>
      <div style="font-size:0.8rem;color:#868e96;">${p.date||''} &middot; ${p.category||p.category_hint||'未分類'}</div>
      <div class="text">${p.text}</div>
      <div style="color:#212529;font-size:0.9rem;">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往 Threads 原文</a>' : ''}
      <div style="margin-top:0.8rem;font-weight:600;color:#212529;">&#128172; 熱門留言（前 ${(p.top_comments||[]).length} 則）</div>
      ${comments || '<div style="color:#adb5bd;">暫無留言資料</div>'}
    </div>
  `;
}

renderPosts();
showDetail(0);
</script>
