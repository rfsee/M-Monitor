真野嘅時候又會有自己見解。\n真好", "likes": 1996, "replies": 3, "url": "https://www.threads.com/@myboooo26_/post/DfHt9Gij00V", "top_comments": [], "engagement": 1999, "category": "其他"}, {"id": "ts_1793429055_937", "author": "新竹", "handle": "legislator2020", "date": "2026-10-31", "timestamp": 1793429055, "text": "新竹\n20分鐘\n今天看到心慧告白的影片，我真的忍不住哭了。\n留下眼淚是因為回想起這一路走來的不容易。謝謝心慧一直做我最堅強的後盾，也謝謝今天來到現場，以及在線上為我加油的每一位好朋友。\n謝謝你們願意花時間、用行動支持我，也支持新竹可以變得更好的可能。\n我想告訴所有親愛的新竹市民：\n不分職業、不分世代、不分政黨，只要你希望新竹更好，你就是新竹隊！\n謝謝大家，讓我們一起為新竹的未來努力！", "likes": 1891, "replies": 39, "url": "https://www.threads.com/@legislator2020/post/DfJgR6gkVxE", "top_comments": [], "engagement": 1930, "category": "案例分享"}, {"id": "ts_1793428996_395", "author": "2026-10-16", "handle": "waterainbow24", "date": "2026-10-16", "timestamp": 1793428996, "text": "2026-10-16\n不想吵架，事已至此看这个吧", "likes": 1653, "replies": 35, "url": "https://www.threads.com/@waterainbow24/post/DejynvwmpzV", "top_comments": [], "engagement": 1688, "category": "抱怨"}, {"id": "ts_1793429129_551", "author": "單身", "handle": "bitchzzcup", "date": "2026-10-31", "timestamp": 1793429129, "text": "單身\n21小時\n有人懂單身一個人在租屋處點一整份烤鴨來吃的爽嗎", "likes": 1210, "replies": 434, "url": "https://www.threads.com/@bitchzzcup/post/DfHSeork3HC", "top_comments": [], "engagement": 1644, "category": "其他"}, {"id": "ts_1793429027_319", "author": "cheyde.zzzz", "handle": "cheyde.zzzz", "date": "2026-10-31", "timestamp": 1793429027, "text": "4天\n每到冬天男友就會變帥 好神奇呀🦭\n這就是傳說中的冬男嗎", "likes": 1565, "replies": 8, "url": "https://www.threads.com/@cheyde.zzzz/post/De86sTjkqj5", "top_comments": [], "engagement": 1573, "category": "其他"}, {"id": "ts_1793428979_506", "author": "單親", "handle": "april_tzu", "date": "2026-10-31", "timestamp": 1793428979, "text": "單親\n6天\n四十歲以後還有機會遇見愛嗎？\n這三年我陪伴了很多離婚後的人，看著他們重新交往、開始談戀愛，甚至遇見真愛迎來幸福的時刻，我每一次聽到，都超級為他們感到開心與感動🥹\n因為我都在他們難受的日子裡陪伴過他們，單身久了有時候真的很難重新相信ㄧ段感情，也可能會懷疑自己，我還有機會遇見適合的人嗎？\n陪伴過這麼多人我告訴他們，你要先相信自己值得被愛💛這樣就能自然遇見一起走下去的人，先留一段時間給自己休息真的很重要，跟自己的內心好好溝通。\n好好整理過去的人生，看看自己曾經遇到的問題，也練習平靜的和自己內在相處。慢慢你會發現看到別人幸福時，不再只有羨慕或失落，也能真心祝福而你也開始享受現在的生活，不急著用另一段關係填補什麼。\n當自己有多一點力氣，也可以把曾經的人生經歷，無私的分享給剛好需要的人，也許是一句話、一點生活上的支持，剛好就成為對方繼續往前走的力量。\n畢竟真心交流是很珍貴的友誼，在這個什麼都很快的時代，遇見一位願意用心聽你說話、不計較得失，也聽得懂你真正想表達什麼的人真的很難得。\n這樣的人不一定要是靈魂伴侶，也不一定要成為另一半。", "likes": 1410, "replies": 156, "url": "https://www.threads.com/@april_tzu/post/De4HyitGuRc", "top_comments": [], "engagement": 1566, "category": "案例分享"}, {"id": "ts_1793429158_924", "author": "babydontletmego8964", "handle": "babydontletmego8964", "date": "2026-10-31", "timestamp": 1793429158, "text": "5天\n我感觉理科大学的顺直男特别恐怖，有一种原始人的感觉", "likes": 1368, "replies": 49, "url": "https://www.threads.com/@babydontletmego8964/post/De8PSMMAQVP", "top_comments": [], "engagement": 1417, "category": "其他"}, {"id": "ts_1793428776_225", "author": "兩性感情", "handle": "hyuwjjidjshhq", "date": "2026-10-12", "timestamp": 1793428776, "text": "兩性感情\n2026-10-12\n男女間真有純友誼嗎？ 我認真覺得是友達以上戀人未滿的備胎藉口而已", "likes": 1291, "replies": 119, "url": "https://www.threads.com/@hyuwjjidjshhq/post/DebLTgjHfar", "top_comments": [], "engagement": 1410, "category": "其他"}, {"id": "ts_1793428877_957", "author": "出軌", "handle": "jan800224", "date": "2026-10-17", "timestamp": 1793428877, "text": "出軌\n2026-10-17\n凌晨四點多\n你還在發酒瘋 說要帶孩子跟「第三者叔叔」去海邊玩\n但孩子明明被你留在朋友家\n你自己卻離開了\n你跑來跟我說了那麼多\n原來那個時候你早就不在孩子身邊\n當初離婚\n是你說三個孩子都不要\n要我當主要照顧者\n離婚協議上約好你一週照顧兩天\n有事情照顧日期都可以協調\n真的不用勉強帶孩子去喝酒的場合\n最後又把他們留下 自己離開\n我表明要去接孩子\n你朋友卻一直不肯給地址\n直到早上才讓我接回\n女兒才五歲 兒子才七歲\n你把他們留在那裡\n自己不在身邊 真的都不會擔心嗎？\n照顧時間可以協調\n但孩子的安全 不能這樣將就", "likes": 1165, "replies": 139, "url": "https://www.threads.com/@jan800224/post/DelhkR1o1Iz", "top_comments": [], "engagement": 1304, "category": "案例分享"}, {"id": "ts_1793428848_192", "author": "2026-10-17", "handle": "loveeissaflowerrrr", "date": "2026-10-17", "timestamp": 1793428848, "text": "2026-10-17\nemi姐姐概念：\nburnmytattoo\n2026-10-16\n正在回覆 @burnmytattoo\n她身上那种无性别气质太迷人了，有人懂吗，有的人提到中性提到无性别，就会想到女人是男人味很重的铁蹄，男人是矫揉造作的0，但是那在我眼里不是无性别不是中性，真正的无性别应该是这样的，清爽地避开所有性别刻板印象而不向另一方倾斜，太迷人了。", "likes": 1235, "replies": 20, "url": "https://www. const CHART_COLORS = ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'];

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});

// Punchlines
const punchlineContainer = document.getElementById('punchlineContainer');
DATA.punchlines.forEach(pl => {
  const div = document.createElement('div');
  div.className = 'punchline-card';
  div.innerHTML = `<div class="punchline-text">\u201c${pl.text}\u201d</div><div class="punchline-source">\u2014 ${pl.source} &middot; &#10084; ${pl.likes?.toLocaleString()}</div>`;
  punchlineContainer.appendChild(div);
});

// Topic horizontal bar chart
const dist = DATA.topicDistribution;
const sortedDist = Object.entries(dist).sort((a,b) => b[1] - a[1]);
new Chart(document.getElementById('topicBarChart'), {
  type: 'bar',
  data: {
    labels: sortedDist.map(([k]) => k),
    datasets: [{
      data: sortedDist.map(([,v]) => v),
      backgroundColor: ['#f5a0b5','#e8a87c','#b8a9c9','#d4c5a9','#a8c5c9','#c9b8a8','#d4b8c9'],
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ display:false }, title:{ display:false } },
      y:{ grid:{ display:false }, title:{ display:false } }
    }
  }
});

// Likes bar chart
const sorted = [...DATA.posts].sort((a,b) => b.likes - a.likes).slice(0,10);
const labels = sorted.map(p => (p.author || '\u533f\u540d') + ' ' + (p.text||'').slice(0,15).replace(/\n/g,' ') + '\u22ef');
new Chart(document.getElementById('likesBarChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '\u8b9a\u6578',
      data: sorted.map(p => p.likes),
      backgroundColor: '#f5a0b5',
      borderRadius: 4,
    }]
  },
  options: {
    responsive:true, maintainAspectRatio:true, indexAxis:'y',
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v } },
      y:{ grid:{ display:false }, title:{ display:false } }
    },
    layout:{ padding:{ right:40 } }
  }
});

// Topic summaries
const topicContainer = document.getElementById('topicContainer');
DATA.topicSummaries.forEach(s => {
  const div = document.createElement('div');
  div.className = 'topic-card';
  div.innerHTML = `<div class="topic-title">&#128204; ${s.topic} <span class="topic-meta">（${s.post_count} 則 · &#10084; ${s.total_likes?.toLocaleString()}）</span></div><div class="topic-summary">${s.summary}</div>`;
  topicContainer.appendChild(div);
});

// Filters
const filterContainer = document.getElementById('filterContainer');
const allBtn = document.createElement('button');
allBtn.className = 'filter-btn active';
allBtn.textContent = '全部';
allBtn.dataset.filter = 'all';
filterContainer.appendChild(allBtn);
const topics = [...new Set(DATA.posts.map(p => p.category || p.category_hint || '其他'))];
topics.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.textContent = t;
  btn.dataset.filter = t;
  filterContainer.appendChild(btn);
});

let currentFilter = 'all';
function renderPosts() {
  const filtered = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const container = document.getElementById('postListContainer');
  container.innerHTML = filtered.map((p,i) => `
    <div class="post-card">
      <h4>&#128100; ${p.author || '匿名'} <span class="meta">@${p.handle||''} &middot; ${p.date||''}</span></h4>
      <div class="text" onclick="this.classList.toggle('expanded')">${p.text}</div>
      <div class="stats">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies} &middot; ${p.category || p.category_hint || '未分類'}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往原文</a>' : ''}
    </div>
  `).join('');
  const sel = document.getElementById('postSelect');
  sel.innerHTML = filtered.map((p,i) => `<option value="${i}">&#10084;${p.likes} | ${p.author||'匿名'} | ${(p.text||'').slice(0,30)}...</option>`).join('');
  sel.onchange = () => showDetail(parseInt(sel.value));
}

filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderPosts();
  });
});

function showDetail(idx) {
  const posts = currentFilter === 'all' ? DATA.posts : DATA.posts.filter(p => (p.category || p.category_hint || '其他') === currentFilter);
  const p = posts[idx];
  if (!p) return;
  const container = document.getElementById('detailContainer');
  let comments = '';
  (p.top_comments || []).forEach(c => {
    comments += `<div class="comment"><div class="comment-author">${c.author||'匿名'}</div><div>${c.text}</div><div style="font-size:0.75rem;color:#adb5bd;">&#10084; ${c.likes}</div></div>`;
  });
  container.innerHTML = `
    <div class="detail-container">
      <h3>&#128100; ${p.author||'匿名'} <span style="font-weight:400;color:#868e96;">@${p.handle||''}</span></h3>
      <div style="font-size:0.8rem;color:#868e96;">${p.date||''} &middot; ${p.category||p.category_hint||'未分類'}</div>
      <div class="text">${p.text}</div>
      <div style="color:#212529;font-size:0.9rem;">&#10084; ${p.likes?.toLocaleString()} &middot; &#128172; ${p.replies}</div>
      ${p.url ? '<a class="post-url" href="' + p.url + '" target="_blank" rel="noopener">&#128279; 前往 Threads 原文</a>' : ''}
      <div style="margin-top:0.8rem;font-weight:600;color:#212529;">&#128172; 熱門留言（前 ${(p.top_comments||[]).length} 則）</div>
      ${comments || '<div style="color:#adb5bd;">暫無留言資料</div>'}
    </div>
  `;
}

renderPosts();
showDetail(0);
</script>
